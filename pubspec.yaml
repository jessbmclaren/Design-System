name: design_system
description: "A Material 3 based Flutter component library with design tokens, theming, and pattern documentation."
version: 0.1.0
homepage: https://github.com/jessbmclaren/Design-System

environment:
  sdk: ^3.11.5
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Lucide icon set (MIT). Tree-shakeable — consumers only bundle the glyphs
  # they use. Backs the DsIcons vocabulary.
  flutter_lucide: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
