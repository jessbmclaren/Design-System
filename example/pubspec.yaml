name: ds_docs
description: "Design System documentation app — patterns, live examples, and code."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../
  go_router: ^17.3.0
  flutter_markdown_plus: ^1.0.11
  syntax_highlight: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/snippets/
