<!DOCTYPE html>
<html lang="en-ZA" data-motion="system" data-theme="light" data-density="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EngenXT · Organise your vehicles · Every state</title>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   ENGENXT · ORGANISE YOUR VEHICLES
   The step after the vehicle and driver import.

   Naming: atomic design levels as prefixes, BEM for structure,
           data-* attributes for runtime state.

     tokens    CSS custom properties     --color-primary
     atoms     a-                        a-btn, a-chip, a-pill
     molecules m-                        m-rule-row, m-proposal-row
     organisms o-                        o-tree, o-inspector, o-proposal
     templates t-                        t-portal, t-screen
     pages     p-                        p-organise
     utilities u-                        u-visually-hidden

   State is never a class. It is an attribute:
     data-state    idle | pending | done | blocked | empty | error
     data-tone     error | warning | success | info | neutral
     data-source   here | inherited | locked | default
     data-lock     open | tighten | exact

   The three rule classes are the spine of this prototype:
     asset  rules resolve from the VEHICLE's home group
     person rules resolve from the DRIVER's home group
     money  rules resolve from the PAYING group
   and the outcome is the strictest of the three. Deny wins.
   ══════════════════════════════════════════════════════════════════════════ */

/* ══ TOKENS ══════════════════════════════════════════════════════════════ */
:root {
  --color-primary:       #1650B8;
  --color-primary-dark:  #0D3A8A;
  --color-primary-light: #EEF3FF;
  --color-primary-08: rgba(22,80,184,0.08);
  --color-primary-12: rgba(22,80,184,0.12);
  --color-primary-30: rgba(22,80,184,0.30);

  --color-secondary:     #E2231A;
  --color-secondary-bg:  #FDEEEE;

  --color-success:      #166832;
  --color-success-bg:   #E8F5EE;
  --color-success-bd:   rgba(22,104,50,0.28);
  --color-warning:      #9C4708;
  --color-warning-bg:   #FDF1E3;
  --color-warning-bd:   rgba(156,71,8,0.28);
  --color-error-text:   #B81510;
  --color-error-bg:     #FDEEEE;
  --color-error-bd:     rgba(184,21,16,0.28);
  --color-info:         #1650B8;
  --color-info-bg:      #EEF3FF;
  --color-info-bd:      rgba(22,80,184,0.28);

  --color-text-primary:   #0d1e2a;
  --color-text-secondary: #52617D;
  --color-text-tertiary:  #6C7385;
  --color-text-muted:     #97A1B4;
  --color-text-on-dark:   #ffffff;

  --color-surface:        #ffffff;
  --color-surface-sunken: #F4F6FA;
  --color-surface-page:   #E9ECF3;
  --color-surface-hover:  #F2F5FB;
  --color-surface-sel:    #E4ECFB;
  --color-border:         rgba(13,30,42,0.12);
  --color-border-light:   rgba(13,30,42,0.07);
  --color-border-strong:  rgba(13,30,42,0.28);
  --color-scrim:          rgba(10,22,40,0.48);

  --color-nav-bg:    #0a1628;
  --color-nav-line:  rgba(255,255,255,0.10);
  --color-nav-text:  rgba(255,255,255,0.62);
  --color-nav-head:  rgba(255,255,255,0.38);
  --color-nav-on:    #ffffff;

  --color-focus: #0D3A8A;

  /* Provenance. One hue per source, never colour alone. */
  --color-here:      #9C4708;
  --color-here-bg:   #FDF1E3;
  --color-inherit:   #52617D;
  --color-inherit-bg:#EEF1F6;
  --color-locked:    #5B3A9E;
  --color-locked-bg: #F0EBFB;
  --color-locked-bd: rgba(91,58,158,0.28);

  --font-sans: "SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono: "SF Mono","Menlo",monospace;
  --text-hero:    28px;
  --text-title:   22px;
  --text-large:   18px;
  --text-heading: 16px;
  --text-body:    15px;
  --text-small:   14px;
  --text-caption: 13px;
  --text-micro:   12px;
  --text-nano:    11px;

  --radius-pill: 999px;
  --radius-lg:   14px;
  --radius-card: 10px;
  --radius-sm:   7px;
  --radius-xs:   5px;

  --shadow-card:    0 1px 2px rgba(13,30,42,0.05), 0 4px 18px rgba(22,80,184,0.07);
  --shadow-pop:     0 12px 40px rgba(10,22,40,0.20), 0 2px 6px rgba(10,22,40,0.10);
  --shadow-overlay: 0 28px 80px rgba(10,22,40,0.32);
  --shadow-toast:   0 8px 30px rgba(10,22,40,0.30);

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px;
  --sp-1h: 6px; --sp-2h: 10px; --sp-4h: 18px;

  --size-target: 44px;
  --size-row:    38px;
  --size-indent: 22px;
  --hairline: 1px;

  --ease-out:    cubic-bezier(0.16,1,0.3,1);
  --ease-in-out: cubic-bezier(0.4,0,0.2,1);
  --dur-fast: 0.12s;
  --dur-base: 0.24s;
  --dur-slow: 0.38s;
}

/* Dark. Every surface and every provenance tone has a twin. */
[data-theme="dark"] {
  --color-primary:       #6E9BF0;
  --color-primary-dark:  #A8C4F8;
  --color-primary-light: #17233A;
  --color-primary-08: rgba(110,155,240,0.10);
  --color-primary-12: rgba(110,155,240,0.16);
  --color-primary-30: rgba(110,155,240,0.32);

  --color-success:    #6FD79A;  --color-success-bg: #10291C;  --color-success-bd: rgba(111,215,154,0.30);
  --color-warning:    #F0B274;  --color-warning-bg: #2C1D0E;  --color-warning-bd: rgba(240,178,116,0.30);
  --color-error-text: #F58C86;  --color-error-bg:   #2E1414;  --color-error-bd:   rgba(245,140,134,0.30);
  --color-info:       #6E9BF0;  --color-info-bg:    #14203A;  --color-info-bd:    rgba(110,155,240,0.30);

  --color-text-primary:   #E8EDF6;
  --color-text-secondary: #A3AEC2;
  --color-text-tertiary:  #8A94A8;
  --color-text-muted:     #6B7488;

  --color-surface:        #131A26;
  --color-surface-sunken: #0E141E;
  --color-surface-page:   #090D15;
  --color-surface-hover:  #1B2433;
  --color-surface-sel:    #1D2B45;
  --color-border:         rgba(232,237,246,0.15);
  --color-border-light:   rgba(232,237,246,0.09);
  --color-border-strong:  rgba(232,237,246,0.34);
  --color-scrim:          rgba(0,0,0,0.62);

  --color-focus: #A8C4F8;

  --color-here:      #F0B274;  --color-here-bg:    #2C1D0E;
  --color-inherit:   #A3AEC2;  --color-inherit-bg: #1B2433;
  --color-locked:    #BFA6F0;  --color-locked-bg:  #221A38;  --color-locked-bd: rgba(191,166,240,0.32);

  --shadow-card:    0 1px 2px rgba(0,0,0,0.40), 0 4px 18px rgba(0,0,0,0.30);
  --shadow-pop:     0 12px 40px rgba(0,0,0,0.62), 0 2px 6px rgba(0,0,0,0.40);
  --shadow-overlay: 0 28px 80px rgba(0,0,0,0.70);
}

/* Comfortable density bumps the row height and the type ramp together. */
[data-density="comfortable"] {
  --size-row: 46px;
  --text-body: 16px;
  --text-small: 15px;
  --text-caption: 14px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: 1.45;
  color: var(--color-text-primary);
  background: var(--color-surface-page);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}
:focus:not(:focus-visible) { outline: none; }

.u-visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.u-num { font-variant-numeric: tabular-nums; }
.u-quiet { color: var(--color-text-secondary); }
.u-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Reduced motion collapses every animation to a still frame. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
[data-motion="off"] *, [data-motion="off"] *::before, [data-motion="off"] *::after {
  animation-duration: 0.001ms !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
}
/* ══ ATOMS ═══════════════════════════════════════════════════════════════ */
.a-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--size-target); padding: 0 var(--sp-4);
  border: var(--hairline) solid transparent; border-radius: var(--radius-sm);
  background: transparent; color: var(--color-text-primary);
  font-size: var(--text-small); font-weight: 600; letter-spacing: 0.005em;
  cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-in-out),
              border-color var(--dur-fast) var(--ease-in-out),
              color var(--dur-fast) var(--ease-in-out);
}
.a-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.a-btn--primary { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
[data-theme="dark"] .a-btn--primary { color: #0a1628; }
.a-btn--primary:not(:disabled):hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }
.a-btn--secondary { background: var(--color-surface); border-color: var(--color-border-strong); }
.a-btn--secondary:not(:disabled):hover { background: var(--color-surface-hover); }
.a-btn--quiet { color: var(--color-text-secondary); padding: 0 var(--sp-2h); }
.a-btn--quiet:not(:disabled):hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
.a-btn--danger { background: var(--color-error-bg); color: var(--color-error-text); border-color: var(--color-error-bd); }
.a-btn--sm { min-height: 32px; padding: 0 var(--sp-2h); font-size: var(--text-caption); }
.a-btn--xs { min-height: 26px; padding: 0 var(--sp-2); font-size: var(--text-micro); border-radius: var(--radius-xs); }
/* A dense inspector wants a small button. A thumb wants 44px. Both, via a
   hit area that extends past the paint. Horizontal growth stays inside the
   4px gap between adjacent actions so neighbours cannot steal a tap. */
.a-btn--xs, .a-btn--sm, .o-tree__more, .a-tag__x, .o-tree__twist { position: relative; }
.a-btn--xs::after   { content:''; position:absolute; inset:-9px -2px; }
.a-btn--sm::after   { content:''; position:absolute; inset:-6px -2px; }
.o-tree__more::after,
.o-tree__twist::after { content:''; position:absolute; inset:-11px -4px; }
.a-tag__x::after    { content:''; position:absolute; inset:-12px -2px; }
/* Touch has no hover, so nothing is allowed to be hover-only there. */
@media (pointer: coarse) {
  .a-btn--xs { min-height: 36px; }
  .o-tree__more { opacity: 1; }
}
.a-btn--full { width: 100%; }

.a-link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--color-primary); font-size: inherit; font-weight: 600;
  text-decoration: underline; text-underline-offset: 3px;
}
.a-link--quiet { color: var(--color-text-secondary); font-weight: 500; }

.a-chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 2px var(--sp-2); border-radius: var(--radius-xs);
  font-size: var(--text-nano); font-weight: 700; letter-spacing: 0.03em;
  text-transform: uppercase; white-space: nowrap;
  border: var(--hairline) solid transparent;
}
.a-chip[data-source="here"]      { background: var(--color-here-bg);    color: var(--color-here);    border-color: var(--color-warning-bd); }
.a-chip[data-source="inherited"] { background: var(--color-inherit-bg); color: var(--color-inherit); border-color: var(--color-border); }
.a-chip[data-source="locked"]    { background: var(--color-locked-bg);  color: var(--color-locked);  border-color: var(--color-locked-bd); }
.a-chip[data-source="default"]   { background: transparent;             color: var(--color-text-muted); border-color: var(--color-border-light); }
.a-chip[data-tone="success"] { background: var(--color-success-bg); color: var(--color-success); border-color: var(--color-success-bd); }
.a-chip[data-tone="warning"] { background: var(--color-warning-bg); color: var(--color-warning); border-color: var(--color-warning-bd); }
.a-chip[data-tone="error"]   { background: var(--color-error-bg);   color: var(--color-error-text); border-color: var(--color-error-bd); }
.a-chip[data-tone="info"]    { background: var(--color-info-bg);    color: var(--color-info);   border-color: var(--color-info-bd); }
.a-chip[data-tone="neutral"] { background: var(--color-surface-sunken); color: var(--color-text-secondary); border-color: var(--color-border-light); }

/* The kind chip. Node kind is visible on the row, never hidden metadata. */
.a-kind {
  display: inline-block; padding: 1px var(--sp-1h); border-radius: var(--radius-xs);
  background: var(--color-surface-sunken); color: var(--color-text-tertiary);
  border: var(--hairline) solid var(--color-border-light);
  font-size: var(--text-nano); font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
}

/* Key:value tag. The colon is structural, not decoration. */
.a-tag {
  display: inline-flex; align-items: center; border-radius: var(--radius-xs);
  border: var(--hairline) solid var(--color-border); background: var(--color-surface);
  font-size: var(--text-micro); overflow: hidden; white-space: nowrap;
}
.a-tag__k { padding: 2px var(--sp-1h); background: var(--color-surface-sunken); color: var(--color-text-tertiary); font-weight: 600; }
.a-tag__v { padding: 2px var(--sp-1h); color: var(--color-text-primary); font-weight: 500; }
.a-tag__x {
  border: 0; background: none; cursor: pointer; padding: 2px var(--sp-1h);
  color: var(--color-text-tertiary); border-left: var(--hairline) solid var(--color-border-light);
}
.a-tag__x:hover { background: var(--color-error-bg); color: var(--color-error-text); }

.a-input, .a-select {
  width: 100%; min-height: 36px; padding: 0 var(--sp-2h);
  border: var(--hairline) solid var(--color-border-strong); border-radius: var(--radius-xs);
  background: var(--color-surface); color: var(--color-text-primary); font-size: var(--text-small);
}
.a-input--sm { min-height: 30px; font-size: var(--text-caption); }
.a-check { width: 17px; height: 17px; accent-color: var(--color-primary); cursor: pointer; flex: none; }

.a-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 34px; padding: 0 var(--sp-1h); height: 19px; border-radius: var(--radius-pill);
  background: var(--color-surface-sunken); color: var(--color-text-tertiary);
  font-size: var(--text-nano); font-weight: 600; font-variant-numeric: tabular-nums;
}
.a-bar { height: 6px; border-radius: var(--radius-pill); background: var(--color-border-light); overflow: hidden; }
.a-bar__fill { height: 100%; background: var(--color-primary); border-radius: inherit; transition: width var(--dur-slow) var(--ease-out); }
.a-bar__fill[data-tone="success"] { background: var(--color-success); }

.a-swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.a-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--color-text-muted); }
.a-dot[data-tone="success"] { background: var(--color-success); }
.a-dot[data-tone="error"]   { background: var(--color-error-text); }
.a-dot[data-tone="warning"] { background: var(--color-warning); }

/* ══ MOLECULES ═══════════════════════════════════════════════════════════ */
.m-card {
  background: var(--color-surface); border: var(--hairline) solid var(--color-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
}
.m-card__head {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5); border-bottom: var(--hairline) solid var(--color-border-light);
}
.m-card__title { margin: 0; font-size: var(--text-heading); font-weight: 700; letter-spacing: -0.01em; }
.m-card__sub { margin: 2px 0 0; font-size: var(--text-caption); color: var(--color-text-secondary); }
.m-card__body { padding: var(--sp-4) var(--sp-5); }
.m-card__foot {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-5); border-top: var(--hairline) solid var(--color-border-light);
  background: var(--color-surface-sunken); border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

.m-note {
  display: flex; gap: var(--sp-2h); align-items: flex-start;
  padding: var(--sp-2h) var(--sp-3); border-radius: var(--radius-sm);
  border: var(--hairline) solid var(--color-border); background: var(--color-surface-sunken);
  font-size: var(--text-caption); line-height: 1.5;
}
.m-note[data-tone="info"]    { background: var(--color-info-bg);    border-color: var(--color-info-bd);    color: var(--color-info); }
.m-note[data-tone="warning"] { background: var(--color-warning-bg); border-color: var(--color-warning-bd); color: var(--color-warning); }
.m-note[data-tone="error"]   { background: var(--color-error-bg);   border-color: var(--color-error-bd);   color: var(--color-error-text); }
.m-note[data-tone="success"] { background: var(--color-success-bg); border-color: var(--color-success-bd); color: var(--color-success); }
.m-note__ico { flex: none; font-size: var(--text-body); line-height: 1.2; }
.m-note strong { font-weight: 700; }

/* One rule row. Value, provenance and the action live on one line. */
.m-rule {
  display: grid; grid-template-columns: minmax(140px,1.3fr) minmax(96px,0.9fr) auto auto;
  gap: var(--sp-3); align-items: center;
  padding: var(--sp-2h) var(--sp-3); border-radius: var(--radius-sm);
  border: var(--hairline) solid transparent;
}
.m-rule + .m-rule { margin-top: 2px; }
.m-rule:hover { background: var(--color-surface-hover); }
.m-rule[data-state="blocked"] { background: var(--color-warning-bg); border-color: var(--color-warning-bd); }
.m-rule__label { font-size: var(--text-small); font-weight: 500; }
.m-rule__class { display: block; font-size: var(--text-nano); color: var(--color-text-tertiary); font-weight: 600; letter-spacing: 0.02em; }
.m-rule__value { font-size: var(--text-small); font-weight: 700; font-variant-numeric: tabular-nums; }
.m-rule__act { display: flex; gap: var(--sp-1); justify-self: end; }
/* In a 360px inspector the four-column grid clips the provenance chip to
   "Set he…". Below that width the row stacks instead of shrinking. */
.m-rule--tight { grid-template-columns: minmax(0,1fr) auto; row-gap: 3px; }
.m-rule--tight > .m-rule__label { grid-column: 1; grid-row: 1; }
.m-rule--tight > .m-rule__act   { grid-column: 2; grid-row: 1; align-self: start; }
.m-rule--tight > .m-rule__value { grid-column: 1 / -1; grid-row: 2; }
.m-rule--tight > .m-rule__src   { grid-column: 1 / -1; grid-row: 3; }
.m-rule__src { min-width: 0; }
.m-rule__src .a-chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: inline-block; }

/* A proposal row. Rename inline, exclude with a checkbox, count on the right. */
.m-prop {
  display: grid; grid-template-columns: auto minmax(120px,1fr) auto minmax(120px,1fr) auto;
  gap: var(--sp-3); align-items: center; padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-sm);
}
.m-prop:hover { background: var(--color-surface-hover); }
.m-prop[data-state="excluded"] { opacity: 0.42; }
.m-prop[data-state="merged"] { background: var(--color-info-bg); }
.m-prop__from { font-size: var(--text-small); color: var(--color-text-secondary); font-family: var(--font-mono); }
.m-prop__arrow { color: var(--color-text-muted); font-size: var(--text-caption); }
.m-prop__count { font-size: var(--text-caption); color: var(--color-text-secondary); font-variant-numeric: tabular-nums; justify-self: end; white-space: nowrap; }

/* The precedence chain. Losers are struck through, the winner is not. */
.m-chain { list-style: none; margin: 0; padding: 0; }
.m-chain__i {
  display: grid; grid-template-columns: 18px 1fr auto; gap: var(--sp-2h);
  align-items: baseline; padding: var(--sp-1h) 0;
  font-size: var(--text-caption); color: var(--color-text-tertiary);
}
.m-chain__i + .m-chain__i { border-top: var(--hairline) solid var(--color-border-light); }
.m-chain__i[data-state="lost"] .m-chain__what { text-decoration: line-through; }
.m-chain__i[data-state="won"] { color: var(--color-text-primary); font-weight: 700; }
.m-chain__i[data-state="unused"] { opacity: 0.5; }
.m-chain__mark { text-align: center; font-weight: 700; }
.m-chain__i[data-state="won"] .m-chain__mark { color: var(--color-success); }
.m-chain__i[data-state="lost"] .m-chain__mark { color: var(--color-text-muted); }
.m-chain__why { color: var(--color-text-tertiary); font-weight: 400; font-size: var(--text-micro); }

.m-kv { display: grid; grid-template-columns: minmax(96px,auto) 1fr; gap: var(--sp-2) var(--sp-4); font-size: var(--text-small); }
.m-kv dt { color: var(--color-text-secondary); }
.m-kv dd { margin: 0; font-weight: 600; }

.m-crumb { display: flex; align-items: center; gap: var(--sp-1); flex-wrap: wrap; font-size: var(--text-micro); color: var(--color-text-tertiary); }
.m-crumb__sep { opacity: 0.5; }
.m-crumb__last { color: var(--color-text-primary); font-weight: 600; }

/* A numbered thing-to-make on the empty start. */
.m-task {
  display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: var(--sp-3);
  align-items: start; padding: var(--sp-3) var(--sp-2);
}
.m-task + .m-task { border-top: var(--hairline) solid var(--color-border-light); }
.m-task__n {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--color-surface-sunken); color: var(--color-text-secondary);
  border: var(--hairline) solid var(--color-border);
  font-size: var(--text-micro); font-weight: 700;
}
.m-task[data-state="done"] .m-task__n { background: var(--color-success-bg); color: var(--color-success); border-color: var(--color-success-bd); }
.m-task__t { display: block; font-size: var(--text-small); font-weight: 700; }
.m-task__b { display: block; margin-top: 2px; font-size: var(--text-caption); color: var(--color-text-secondary); }

/* One rung of the layer chain. */
.m-chainrow {
  display: grid; grid-template-columns: 44px minmax(0,1fr) auto auto; gap: var(--sp-3);
  align-items: center; padding: var(--sp-1h) 0;
}
.m-chainrow + .m-chainrow { border-top: var(--hairline) solid var(--color-border-light); }
.m-chainrow__n { font-size: var(--text-nano); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-text-tertiary); }
.m-chainrow__v { font-size: var(--text-small); font-weight: 600; }

.m-empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2h);
  padding: var(--sp-8) var(--sp-5); text-align: center; color: var(--color-text-secondary);
}
.m-empty__title { margin: 0; font-size: var(--text-heading); font-weight: 700; color: var(--color-text-primary); }
.m-empty__body { margin: 0; max-width: 42ch; font-size: var(--text-small); }
/* ══ ORGANISMS ═══════════════════════════════════════════════════════════ */

/* The tree. A real ARIA tree: one tabbable node, arrow keys on the treeitem. */
.o-tree { list-style: none; margin: 0; padding: var(--sp-2); }
.o-tree ul { list-style: none; margin: 0; padding: 0; }
.o-tree__row {
  display: flex; align-items: center; gap: var(--sp-1h);
  min-height: var(--size-row); padding: 0 var(--sp-2) 0 0;
  border-radius: var(--radius-sm); cursor: pointer;
  border: 2px solid transparent;
}
.o-tree__row:hover { background: var(--color-surface-hover); }
.o-tree__item[aria-selected="true"] > .o-tree__row {
  background: var(--color-surface-sel);
  border-color: var(--color-primary);
  box-shadow: inset 3px 0 0 var(--color-primary);
}
.o-tree__item:focus { outline: none; }
.o-tree__item:focus-visible > .o-tree__row { outline: 3px solid var(--color-focus); outline-offset: -1px; }
.o-tree__twist {
  flex: none; width: 22px; height: 22px; border: 0; background: none; cursor: pointer;
  color: var(--color-text-tertiary); font-size: 10px; display: grid; place-items: center;
  transition: transform var(--dur-fast) var(--ease-in-out);
}
.o-tree__twist[data-state="open"] { transform: rotate(90deg); }
.o-tree__twist[data-state="leaf"] { visibility: hidden; }
/* The name wins the width contest. Meta yields, because "Take…" and "T."
   are what happens when a chip row is allowed to starve the only text that
   tells you which group you are looking at. */
.o-tree__main { flex: 1 1 auto; min-width: 0; padding: var(--sp-1) 0; }
.o-tree__name {
  display: block; font-size: var(--text-small); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.o-tree__sub {
  display: flex; align-items: center; gap: var(--sp-1); min-width: 0;
  font-size: var(--text-nano); color: var(--color-text-tertiary);
}
.o-tree__sub .a-kind, .o-tree__sub .a-chip { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.o-tree__meta { display: flex; align-items: center; gap: var(--sp-1h); flex: none; }
/* Drop indicators are 3px with a cap, never a 1px rumour. */
.o-tree__row[data-drop="into"] { border-color: var(--color-primary); background: var(--color-primary-12); }
.o-tree__row[data-drop="above"] { box-shadow: 0 -3px 0 var(--color-primary), -3px -3px 0 var(--color-primary); }
.o-tree__row[data-drop="below"] { box-shadow: 0 3px 0 var(--color-primary), -3px 3px 0 var(--color-primary); }
/* The overflow control is always visible. Hover-only controls do not exist on touch. */
.o-tree__more {
  flex: none; width: 26px; height: 26px; border-radius: var(--radius-xs);
  border: 0; background: none; cursor: pointer; color: var(--color-text-tertiary);
  opacity: 0.45; font-size: var(--text-body); line-height: 1;
}
.o-tree__row:hover .o-tree__more, .o-tree__more:focus-visible { opacity: 1; background: var(--color-surface); }

.o-panel {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--color-surface); border: var(--hairline) solid var(--color-border);
  border-radius: var(--radius-lg); overflow: hidden;
}
.o-panel__head {
  display: flex; align-items: center; gap: var(--sp-2); flex: none;
  padding: var(--sp-2h) var(--sp-3); border-bottom: var(--hairline) solid var(--color-border-light);
  background: var(--color-surface-sunken);
}
.o-panel__title { margin: 0; font-size: var(--text-caption); font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--color-text-secondary); }
.o-panel__body { flex: 1 1 auto; min-height: 0; overflow: auto; }
.o-panel__foot { flex: none; padding: var(--sp-2h) var(--sp-3); border-top: var(--hairline) solid var(--color-border-light); background: var(--color-surface-sunken); }

/* The records table. Selection is persistent and stated. */
/* Wide content scrolls inside its own container rather than squashing a
   registration onto two lines. */
.o-records { width: 100%; min-width: 640px; border-collapse: collapse; font-size: var(--text-caption); }
.o-records td, .o-records th { white-space: nowrap; }
.o-records th {
  position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 600;
  padding: var(--sp-2) var(--sp-2h); background: var(--color-surface-sunken);
  border-bottom: var(--hairline) solid var(--color-border); color: var(--color-text-secondary);
  white-space: nowrap;
}
.o-records td { padding: var(--sp-2) var(--sp-2h); border-bottom: var(--hairline) solid var(--color-border-light); }
.o-records tr[data-state="selected"] td { background: var(--color-surface-sel); }
.o-records tr:hover td { background: var(--color-surface-hover); }
.o-records tr[data-state="selected"]:hover td { background: var(--color-surface-sel); }
.o-records__home { color: var(--color-text-secondary); font-size: var(--text-micro); }

.o-selbar {
  display: flex; align-items: center; gap: var(--sp-2h); flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-3); background: var(--color-primary-08);
  border-top: var(--hairline) solid var(--color-primary-30);
}
.o-selbar__n { font-size: var(--text-caption); font-weight: 700; font-variant-numeric: tabular-nums; }

/* The state map, in the manner of the sign-up prototype. */
.o-state-nav {
  grid-area: nav; overflow-y: auto; padding: var(--sp-4) var(--sp-3) var(--sp-8);
  background: var(--color-nav-bg); color: var(--color-nav-text);
  border-right: var(--hairline) solid var(--color-nav-line);
}
.o-state-nav__brand { display: flex; align-items: baseline; gap: var(--sp-2); margin: 0 0 var(--sp-1) var(--sp-2); }
.o-state-nav__mark { font-size: var(--text-heading); font-weight: 800; color: var(--color-nav-on); letter-spacing: -0.02em; }
.o-state-nav__mark em { font-style: normal; color: #E2231A; }
.o-state-nav__tag { font-size: var(--text-nano); color: var(--color-nav-head); letter-spacing: 0.06em; text-transform: uppercase; }
.o-state-nav__lede { margin: 0 var(--sp-2) var(--sp-4); font-size: var(--text-micro); line-height: 1.5; color: var(--color-nav-head); }
.o-state-nav__h {
  margin: var(--sp-4) 0 var(--sp-1); padding: 0 var(--sp-2);
  font-size: var(--text-nano); font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--color-nav-head);
}
.o-state-nav__b {
  display: flex; align-items: baseline; gap: var(--sp-2); width: 100%;
  padding: var(--sp-1h) var(--sp-2); margin-bottom: 1px; min-height: 34px; position: relative;
  border: 0; border-radius: var(--radius-xs); background: none; cursor: pointer;
  color: var(--color-nav-text); font-size: var(--text-caption); text-align: left; line-height: 1.35;
}
.o-state-nav__b:hover { background: rgba(255,255,255,0.07); color: var(--color-nav-on); }
.o-state-nav__b[aria-current="true"] { background: rgba(255,255,255,0.13); color: var(--color-nav-on); font-weight: 600; }
.o-state-nav__b:focus-visible { outline: 3px solid #A8C4F8; outline-offset: -2px; }
.o-state-nav__id { flex: none; width: 22px; font-family: var(--font-mono); font-size: var(--text-nano); color: var(--color-nav-head); }
.o-state-nav__b[aria-current="true"] .o-state-nav__id { color: #A8C4F8; }
.o-state-nav__b::after, .o-state-nav__chip::after { content:''; position:absolute; inset:-7px -2px; }
.o-state-nav__sw { display: flex; flex-wrap: wrap; gap: var(--sp-1); padding: var(--sp-1) var(--sp-2) 0; }
.o-state-nav__chip {
  border: var(--hairline) solid var(--color-nav-line); background: rgba(255,255,255,0.05);
  color: var(--color-nav-text); border-radius: var(--radius-pill);
  padding: 3px var(--sp-2h); font-size: var(--text-nano); font-weight: 600; cursor: pointer; min-height: 30px; position: relative;
}
.o-state-nav__chip[aria-pressed="true"] { background: #fff; color: #0a1628; border-color: #fff; }

/* ══ TEMPLATES ═══════════════════════════════════════════════════════════ */
.p-organise {
  display: grid; grid-template-areas: "nav stage"; grid-template-columns: 264px 1fr;
  height: 100vh; height: 100dvh;
}
.p-organise__stage {
  grid-area: stage; min-width: 0; min-height: 0; overflow: auto;
  padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3);
}
.t-portal {
  flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0;
  background: var(--color-surface-sunken); border: var(--hairline) solid var(--color-border);
  border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-card);
}
.t-portal__bar {
  flex: none; display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2h) var(--sp-4); background: var(--color-surface);
  border-bottom: var(--hairline) solid var(--color-border);
}
.t-portal__mark { font-size: var(--text-small); font-weight: 800; letter-spacing: -0.02em; }
.t-portal__mark em { font-style: normal; color: var(--color-secondary); }
.t-portal__step { font-size: var(--text-micro); color: var(--color-text-tertiary); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-portal__mark { flex: none; }
.t-portal__body { flex: 1 1 auto; min-height: 0; overflow: auto; }
.t-screen { display: none; padding: var(--sp-5); }
.t-screen[data-state="on"] { display: block; }
.t-screen--flush { padding: 0; height: 100%; }
.t-screen__lede { max-width: 62ch; margin: 0 0 var(--sp-4); }
.t-screen__h1 { margin: 0 0 var(--sp-1); font-size: var(--text-title); font-weight: 800; letter-spacing: -0.02em; }
.t-screen__sub { margin: 0; font-size: var(--text-small); color: var(--color-text-secondary); }

/* The workspace: tree, records, inspector. */
.t-work { display: grid; grid-template-columns: 300px minmax(0,1fr) 360px; gap: var(--sp-3); height: 100%; padding: var(--sp-3); }
/* min-width:0 as well as min-height:0. Without it the records table's own
   min-width sizes the whole grid column and the page scrolls sideways. */
.t-work > * { min-height: 0; min-width: 0; }

.p-organise__caption {
  flex: none; margin: 0; font-size: var(--text-micro); color: var(--color-text-tertiary);
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
}

/* Overlays. */
.o-scrim {
  position: fixed; inset: 0; background: var(--color-scrim); z-index: 40;
  display: grid; place-items: center; padding: var(--sp-5);
  opacity: 0; pointer-events: none; transition: opacity var(--dur-base) var(--ease-in-out);
}
.o-scrim[data-state="on"] { opacity: 1; pointer-events: auto; }
.o-dialog {
  width: min(560px, 100%); max-height: 84vh; overflow: auto;
  background: var(--color-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-overlay); border: var(--hairline) solid var(--color-border);
}
.o-dialog--wide { width: min(760px, 100%); }
.o-dialog__head { padding: var(--sp-4) var(--sp-5) var(--sp-3); }
.o-dialog__title { margin: 0; font-size: var(--text-large); font-weight: 800; letter-spacing: -0.01em; }
.o-dialog__body { padding: 0 var(--sp-5) var(--sp-4); }
.o-dialog__foot {
  display: flex; justify-content: flex-end; gap: var(--sp-2); flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-5); border-top: var(--hairline) solid var(--color-border-light);
  background: var(--color-surface-sunken); border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

.o-pop {
  position: fixed; z-index: 50; width: min(420px, calc(100vw - 32px));
  max-height: calc(100vh - 32px); overflow: auto;
  background: var(--color-surface); border: var(--hairline) solid var(--color-border);
  border-radius: var(--radius-card); box-shadow: var(--shadow-pop); padding: var(--sp-4);
}
.o-pop[hidden] { display: none; }
.o-pop__title { margin: 0 0 var(--sp-2h); font-size: var(--text-caption); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-secondary); }

.a-toast {
  position: fixed; left: 50%; bottom: var(--sp-6); transform: translate(-50%, 12px);
  z-index: 60; display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2h) var(--sp-3) var(--sp-2h) var(--sp-4);
  background: #0d1e2a; color: #fff; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-toast); font-size: var(--text-caption);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
}
[data-theme="dark"] .a-toast { background: #E8EDF6; color: #0d1e2a; }
.a-toast[data-state="on"] { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.a-toast__undo { background: none; border: 0; cursor: pointer; color: #A8C4F8; font-weight: 700; font-size: var(--text-caption); text-decoration: underline; text-underline-offset: 3px; }
[data-theme="dark"] .a-toast__undo { color: var(--color-primary-dark); }

/* ══ RESPONSIVE ══════════════════════════════════════════════════════════ */
/* Below 900px the tree is replaced by a flat grouped list with a move sheet.
   Nesting UI has no touch story, so it does not pretend to have one. */
@media (max-width: 1180px) {
  .t-work { grid-template-columns: 240px minmax(0,1fr); }
  .t-work__inspect { grid-column: 1 / -1; max-height: 340px; }
}
@media (max-width: 900px) {
  .p-organise { grid-template-areas: "nav" "stage"; grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .o-state-nav { max-height: 190px; border-right: 0; border-bottom: var(--hairline) solid var(--color-nav-line); }
  .p-organise__stage { padding: var(--sp-3); }
  .t-work { grid-template-columns: 1fr; grid-auto-rows: minmax(0,auto); height: auto; }
  .t-work__tree { display: none; }
  .t-work__flat { display: flex !important; }
  .m-rule { grid-template-columns: 1fr auto; row-gap: var(--sp-1); }
  .m-rule__act { grid-column: 2; }
  .m-prop { grid-template-columns: auto 1fr auto; }
  .m-prop__arrow, .m-prop__from { display: none; }
}
@media (max-width: 560px) {
  .t-screen { padding: var(--sp-3); }
  .m-card__head, .m-card__body { padding: var(--sp-3); }
  .m-card__foot { padding: var(--sp-3); }
  .a-btn { padding: 0 var(--sp-3); }
}
.t-work__flat { display: none; flex-direction: column; }

@media print { .o-state-nav { display: none; } }
/* CSS-PART-4 */
</style>
</head>
<body>
<div class="p-organise">

  <!-- ══ STATE MAP ══════════════════════════════════════════════════════ -->
  <nav class="o-state-nav" aria-label="Prototype states">
    <p class="o-state-nav__brand">
      <span class="o-state-nav__mark">Engen<em>XT</em></span>
      <span class="o-state-nav__tag">Prototype</span>
    </p>
    <p class="o-state-nav__lede">
      Organise your vehicles: the step after the vehicle and driver import.
      Pick a sample account, then walk the states. Every state is reachable.
    </p>

    <h2 class="o-state-nav__h">Sample account</h2>
    <div class="o-state-nav__sw" id="accountSwitch" role="group" aria-label="Sample account"></div>

    <div id="stateList"></div>

    <h2 class="o-state-nav__h">Modes</h2>
    <div class="o-state-nav__sw" role="group" aria-label="Display modes">
      <button class="o-state-nav__chip" type="button" data-mode="theme"   aria-pressed="false">Dark</button>
      <button class="o-state-nav__chip" type="button" data-mode="motion"  aria-pressed="false">Reduced motion</button>
      <button class="o-state-nav__chip" type="button" data-mode="density" aria-pressed="false">Comfortable</button>
      <button class="o-state-nav__chip" type="button" data-mode="narrow"  aria-pressed="false">320dp</button>
    </div>
  </nav>

  <!-- ══ STAGE ══════════════════════════════════════════════════════════ -->
  <div class="p-organise__stage" id="stage">
    <div class="t-portal" id="portal">
      <div class="t-portal__bar">
        <span class="t-portal__mark">Engen<em>XT</em></span>
        <span class="t-portal__step" id="portalStep">Setup</span>
        <span style="margin-left:auto" class="t-portal__step" id="portalAccount"></span>
      </div>
      <div class="t-portal__body" id="portalBody">

        <!-- A · Nothing set up yet. The real starting point. -->
        <section class="t-screen" id="scStart" aria-labelledby="startH"></section>

        <!-- B · Layers: what the levels in this business are called. -->
        <section class="t-screen" id="scLayers" aria-labelledby="layersH"></section>

        <!-- C · Groups: the actual places and teams. -->
        <section class="t-screen" id="scGroups" aria-labelledby="groupsH"></section>

        <!-- D · Labels: cross-cutting, never granting access. -->
        <section class="t-screen" id="scTags" aria-labelledby="tagsH"></section>

        <!-- Simple mode, for an account with one layer and nothing to nest. -->
        <section class="t-screen" id="scSimple" aria-labelledby="simpleH"></section>


        <!-- D + E · Structure workspace. -->
        <section class="t-screen t-screen--flush" id="scWork" aria-label="Structure workspace">
          <div class="t-work">
            <div class="o-panel t-work__tree">
              <div class="o-panel__head">
                <h2 class="o-panel__title">Structure</h2>
                <button class="a-btn a-btn--xs a-btn--secondary" type="button" id="addChildBtn" style="margin-left:auto">Add</button>
              </div>
              <div style="padding:var(--sp-2);border-bottom:var(--hairline) solid var(--color-border-light)">
                <input class="a-input a-input--sm" type="search" id="treeSearch" placeholder="Find a group" aria-label="Find a group">
              </div>
              <div class="o-panel__body" id="treeHost"></div>
              <div class="o-panel__foot" id="treeFoot"></div>
            </div>

            <div class="o-panel t-work__flat" id="flatHost"></div>

            <div class="o-panel t-work__records">
              <div class="o-panel__head" id="recordsHead"></div>
              <div class="o-panel__body" id="recordsHost"></div>
              <div id="selBarHost"></div>
            </div>

            <div class="o-panel t-work__inspect">
              <div class="o-panel__head">
                <h2 class="o-panel__title" id="inspectTitle">Inspector</h2>
              </div>
              <div class="o-panel__body" id="inspectHost"></div>
            </div>
          </div>
        </section>

        <!-- F · Shared asset. -->
        <section class="t-screen" id="scShared" aria-labelledby="sharedH"></section>

        <!-- G · Explain a decline. -->
        <section class="t-screen" id="scDecline" aria-labelledby="declineH"></section>

        <!-- H · Done. -->
        <section class="t-screen" id="scDone" aria-labelledby="doneH"></section>

      </div>
    </div>
    <p class="p-organise__caption" id="caption"></p>
  </div>
</div>

<!-- Overlays -->
<div class="o-scrim" id="scrim" role="presentation">
  <div class="o-dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"></div>
</div>
<div class="o-pop" id="pop" role="dialog" aria-label="How this was decided" hidden></div>
<div class="a-toast" id="toast" role="status"></div>
<span class="u-visually-hidden" id="announcer" role="status" aria-live="polite"></span>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   DATA
   Three sample accounts, one rule schema. Every count on screen is computed
   from these rows, never hardcoded, so the prototype cannot quietly lie.
   ══════════════════════════════════════════════════════════════════════════ */

/* Rule classes are the spine. A rule resolves from the vehicle, the driver
   or the paying group depending on what kind of rule it is. `dir` is the
   monotonic direction that makes "tighten only" decidable. */
const RULES = [
  { key:'products',  label:'Fuel products',         cls:'asset',  type:'set',    dir:'subset', needs:'fuelType' },
  { key:'maxLitres', label:'Max litres per fill',   cls:'asset',  type:'litres', dir:'lower',  needs:'tank' },
  { key:'window',    label:'Fuelling window',       cls:'person', type:'window', dir:'inside' },

  { key:'approval',  label:'Approval needed above', cls:'money',  type:'rand',   dir:'lower' },
];
const RULE_BY_KEY = Object.fromEntries(RULES.map(r => [r.key, r]));
const CLS_LABEL = { asset:'From the vehicle', person:'From the driver', money:'From the paying group' };

/* A small deterministic PRNG. No Math.random, so a reload is reproducible

let _seed = 20260804;
function rnd(){ _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
function pick(a){ return a[Math.floor(rnd() * a.length)]; }
function reseed(){ _seed = 20260804; }

function buildAccount(id){
  reseed();
  const spec = SPECS[id];
  const vehicles = [], drivers = [];
  let n = 0;
  spec.dist.forEach(([sub, region, branch, count]) => {
    for (let i = 0; i < count; i++){
      const cls = pick(['LDV','LDV','Panel van','Panel van','Minibus','Refrigerated van']);
      const tankByCls = { 'LDV':80, 'Panel van':70, 'Minibus':60, 'Refrigerated van':90 };
      /* Tank capacity is missing on a chunk of every real import. The
         "this rule is inactive for N vehicles" warning depends on it. */
      const hasTank = rnd() > (id === 'solo' ? 0.0 : 0.34);
      vehicles.push({
        id: 'v' + (++n),

        shift: pick(['Day','Day','Night']),

/* Column key on a vehicle for a given CSV column heading. */
const COL_FIELD = {
  'Subsidiary':'sub', 'Region':'region', 'Branch':'branch',
  'Cost Centre':'cc', 'Shift':'shift', 'Class':'cls', 'Registration':'reg',
};

/* Policy seeds, applied by group name once a structure exists. This is what
   makes the cascade, the locks and the move-impact preview real. */
const POLICY_SEEDS = [
  { match: r => r.parentId === null, rules: {
      products:  { value:['Diesel','Petrol'], lock:'tighten' },
      maxLitres: { value:1.15,                lock:'open' },
      window:    { value:[5,19],              lock:'tighten' },
      pin:       { value:true,                lock:'exact' },
      odo:       { value:true,                lock:'open' },

  { match: r => r.name === 'Takealot Logistics', rules: {

  }},

/* ══════════════════════════════════════════════════════════════════════════
   STATE + ENGINE
   ══════════════════════════════════════════════════════════════════════════ */
const S = {
  accountId: null, account: null,
  layers: [],          /* ordered level names: ['Subsidiary','Region','Branch'] */
  groups: [],          /* {id,name,kind,parentId,system} */
  attach: {},          /* groupId -> { ruleKey: {value, lock} } */
  tagGroups: [],       /* {key, values:[...]}  key:value, never bare strings */
  tags: {},            /* vehicleId -> { key: value } */
  loans: [],           /* {vehicleId, groupId, from, to}  time-bounded operating */
  expanded: new Set(),
  selectedGroup: null,
  selectedRows: new Set(),
  undo: [],
  screen: 'A',
  proposal: null,
  seq: 0,
};

const uid = p => p + (++S.seq);
const byId = id => S.groups.find(g => g.id === id) || null;
const childrenOf = id => S.groups.filter(g => g.parentId === id);
const rootGroup = () => S.groups.find(g => g.parentId === null) || null;

function ancestors(id){            /* self, parent, ... root */
  const out = []; let g = byId(id); let guard = 0;
  while (g && guard++ < 64){ out.push(g); g = g.parentId ? byId(g.parentId) : null; }
  return out;
}
function pathOf(id){ return ancestors(id).reverse(); }
function pathString(id){ return pathOf(id).map(g => g.name).join(' › '); }
function depthOf(id){ return ancestors(id).length - 1; }
/* The layer chain is asked for once and answers "what do you call this
   level". A node's kind comes from its depth, so two siblings can never end
   up labelled Department and Region and make the tree illegible. */
function layerAt(depth){ return S.layers[depth - 1] || null; }
function kindOf(g){
  if (!g) return '';
  if (g.system) return 'Holding';
  if (g.parentId === null) return 'Company';
  return layerAt(depthOf(g.id)) || 'Group';
}
function maxUsedDepth(){ return S.groups.reduce((m, g) => Math.max(m, depthOf(g.id)), 0); }

function descendants(id){
  const out = []; const walk = p => childrenOf(p).forEach(c => { out.push(c); walk(c.id); });
  walk(id); return out;
}
function canMoveUnder(nodeId, targetId){
  if (nodeId === targetId) return false;
  if (byId(nodeId)?.parentId === null) return false;      /* the root never moves */
  return !ancestors(targetId).some(a => a.id === nodeId); /* no cycles */
}
function vehiclesIn(id, deep){
  const ids = new Set([id].concat(deep ? descendants(id).map(g => g.id) : []));
  return S.account.vehicles.filter(v => ids.has(v.homeId));
}
function driversIn(id, deep){
  const ids = new Set([id].concat(deep ? descendants(id).map(g => g.id) : []));
  return S.account.drivers.filter(d => ids.has(d.homeId));
}

/* ── Inference ─────────────────────────────────────────────────────────── */
/* Trim, casefold, collapse whitespace, strip a place-word suffix. This is
   what turns "Cape Town", "cape town " and "Cape Town Branch" into one group
   instead of three siblings nobody can tell apart in a dropdown. */
function normKey(s){
  return String(s || '').toLowerCase().trim().replace(/\s+/g, ' ')
    .replace(/\s+(depot|branch|site|yard|hub|dc|distribution centre)$/,'').trim();
}
function titleise(s){
  return String(s || '').trim().replace(/\s+/g,' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}

function structuralColumns(){
  return S.account.columns.filter(c => {
    const f = COL_FIELD[c];
    if (!f || f === 'reg') return false;
    if (!STRUCTURAL.includes(c.toLowerCase())) return false;
    return new Set(S.account.vehicles.map(v => v[f]).filter(Boolean)).size > 1;
  });
}

/* Distinct values of a column, clustered by the normalised key. */
function clusterColumn(col){
  const f = COL_FIELD[col];
  const map = new Map();
  let blank = 0;
  S.account.vehicles.forEach(v => {
    const raw = v[f];
    if (!raw || !String(raw).trim()) { blank++; return; }
    const k = normKey(raw);
    if (!map.has(k)) map.set(k, { key:k, name:titleise(raw), variants:[], count:0 });
    const e = map.get(k);
    e.count++;
    if (!e.variants.includes(raw)) e.variants.push(raw);
  });
  return { col, field:f, rows:[...map.values()].sort((a,b) => b.count - a.count), blank };
}

/* cols is an ordered list. The first column becomes the top level, each
   further column nests beneath the one before it. The customer only ever
   sees two selects; the seeded deep account uses three. */
function buildProposal(cols){
  cols = [].concat(cols).filter(Boolean);
  const c = clusterColumn(cols[0]);
  return {
    cols, blank: c.blank,
    rows: c.rows.map(r => ({ ...r, include:true })),
    nestUnder: rootGroup() ? rootGroup().id : null,
  };
}

/* ── Committing a proposal ─────────────────────────────────────────────── */
function ensureRoot(){
  if (rootGroup()) return rootGroup();
  const g = { id:uid('g'), name:S.account.spec.company, kind:'Company', parentId:null };
  S.groups.push(g);
  S.expanded.add(g.id);
  return g;
}
function systemUnassigned(){
  let u = S.groups.find(g => g.system);
  if (!u){
    u = { id:uid('g'), name:'Unassigned', kind:'Team', parentId:rootGroup().id, system:true };
    S.groups.push(u);
  }
  return u;
}

const KIND_FOR = { Subsidiary:'Subsidiary', Region:'Region', Branch:'Branch',
                   'Cost Centre':'Department', Department:'Department' };

function commitProposal(p){
  snapshot('Created groups');
  const root = ensureRoot();
  const parent = byId(p.nestUnder) || root;
  const nameByKey = new Map(p.rows.map(r => [r.key, r]));
  const nodes = new Map();       /* full path key -> group */

  /* Identity is the full path, not the name, so a Sandton under one
     subsidiary is not confused with a Sandton under another. */
  S.account.vehicles.forEach(v => {
    let cur = parent, path = '', placed = null;
    for (let i = 0; i < p.cols.length; i++){
      const raw = v[COL_FIELD[p.cols[i]]];
      if (!raw || !String(raw).trim()) break;
      const k = normKey(raw);
      if (i === 0){
        const row = nameByKey.get(k);
        if (!row || !row.include) break;
      }
      path += (path ? '|' : '') + k;
      let g = nodes.get(path);
      if (!g){
        g = { id: uid('g'),
              name: i === 0 ? (nameByKey.get(k) || {}).name || titleise(raw) : titleise(raw),
              kind: KIND_FOR[p.cols[i]] || 'Team',
              parentId: cur.id };
        S.groups.push(g); nodes.set(path, g);
      }
      cur = g; placed = g;
    }
    v.homeId = placed ? placed.id : null;
  });

  /* Nothing is silently dropped onto the top group. */
  const unassigned = systemUnassigned();
  S.account.vehicles.forEach(v => { if (!v.homeId) v.homeId = unassigned.id; });

  /* Drivers spread across the groups that hold vehicles, so the shared case is real. */
  const holders = S.groups.filter(g => !g.system && !childrenOf(g.id).length).map(g => g.id);
  S.account.drivers.forEach((d, i) => { d.homeId = holders.length ? holders[i % holders.length] : root.id; });

  S.expanded.add(root.id);
  childrenOf(root.id).forEach(g => S.expanded.add(g.id));

  /* Every unmapped column becomes a label group. Nothing in the file is thrown away. */
  S.layers = p.cols.map(c => KIND_FOR[c] || c);
  buildTagGroups(p.cols);
  seedPolicies();
  S.selectedGroup = root.id;
  S.proposal = null;
}

function buildTagGroups(usedCols){
  S.tagGroups = []; S.tags = {};
  S.account.columns.forEach(col => {
    const f = COL_FIELD[col];
    if (!f || f === 'reg' || usedCols.includes(col)) return;
    const values = [...new Set(S.account.vehicles.map(v => v[f]).filter(Boolean).map(titleise))];
    if (!values.length || values.length > 40) return;
    S.tagGroups.push({ key: col.toLowerCase().replace(/\s+/g,'-'), label: col, values,
                       exclusive: values.length <= 4 });
    S.account.vehicles.forEach(v => {
      if (!v[f]) return;
      (S.tags[v.id] = S.tags[v.id] || {})[col.toLowerCase().replace(/\s+/g,'-')] = titleise(v[f]);
    });
  });
}

function seedPolicies(){
  S.attach = {};
  POLICY_SEEDS.forEach(seed => {
    S.groups.filter(seed.match).forEach(g => {
      S.attach[g.id] = Object.assign({}, S.attach[g.id], JSON.parse(JSON.stringify(seed.rules)));
    });
  });
  /* Money limits are sized to the vehicles that are actually in the account.
     A R9 000 per-fill limit shown to somebody with five 80-litre vans reads
     as a number nobody chose, which is how a starting policy loses trust. */
  const root = rootGroup();
  if (!root || !S.attach[root.id]) return;
  const biggest = Math.max(80, ...S.account.vehicles.map(v => v.tank || 0));
  const round = n => Math.round(n / 500) * 500;
  const fill = round(biggest * 24.6 * 1.1);
  S.attach[root.id].maxValue.value = fill;
  S.attach[root.id].dailyCap.value = round(fill * 1.6);
  S.attach[root.id].approval.value = round(fill * 0.7);
  const log = S.groups.find(g => g.name === 'Takealot Logistics');
  if (log && S.attach[log.id]){
    S.attach[log.id].maxValue.value = round(fill * 0.85);
    S.attach[log.id].dailyCap.value = round(fill * 1.35);
  }
}

/* Simple mode still has a real root and a real policy. The customer just
   never sees the word "group". Promotion adds children to what exists. */
function ensureSimple(){
  const root = ensureRoot();
  if (S.account.vehicles.some(v => !v.homeId)){
    S.account.vehicles.forEach(v => v.homeId = root.id);
    S.account.drivers.forEach(d => d.homeId = root.id);
  }
  if (!S.tagGroups.length) buildTagGroups([]);
  if (!Object.keys(S.attach).length) seedPolicies();
  S.selectedGroup = root.id;
}

/* fresh() is the true empty state: a company and nothing else.
   sample() loads the dummy data for whichever account is selected, so the
   later states have something to show without pretending it was inferred. */
function fresh(){
  if (!S.accountId) setAccount('group');
  S.groups = []; S.attach = {}; S.tags = {}; S.tagGroups = []; S.loans = [];
  S.layers = []; S.expanded = new Set(); S.selectedRows = new Set();
  S.selectedGroup = null; S.proposal = null; S.undo = []; S.seq = 0;
  treeFilter = ''; treeFocusId = null;
  S.account.vehicles.forEach(v => { v.homeId = null; v.sharedWith = []; });
  S.account.drivers.forEach(d => { d.homeId = null; });
  ensureRoot();
}
function sample(){
  if (!S.accountId) setAccount('group');
  if (S.groups.length > 1) return;
  fresh();
  ensureStructure();
}
function ensureStructure(){
  if (S.groups.length > 1) return;
  const cols = structuralColumns();
  if (!cols.length){ ensureSimple(); return; }
  S.groups = []; S.attach = {}; ensureRoot();
  const p = buildProposal(cols.slice(0, 3));
  commitProposal(p);
}

/* ── Policy resolution, per rule ───────────────────────────────────────── */
/* Nearest-policy-wins would let a site attaching a fuel-type rule silently
   delete head office's night ban for everything beneath it. So the effective
   policy is a rule-by-rule merge, each rule carrying its own provenance. */
function isTighter(key, nv, cv){
  const r = RULE_BY_KEY[key];
  if (cv == null) return true;
  switch (r.dir){
    case 'lower':  return nv <= cv;
    case 'subset': return nv.every(x => cv.includes(x));
    case 'inside': return nv[0] >= cv[0] && nv[1] <= cv[1];
    case 'onlyOn': return nv === true || cv === false;
  }
  return true;
}
function strictest(key, vals){
  const r = RULE_BY_KEY[key];
  return vals.filter(v => v != null).reduce((a, b) => {
    if (a == null) return b;
    switch (r.dir){
      case 'lower':  return Math.min(a, b);
      case 'subset': return a.filter(x => b.includes(x));
      case 'inside': return [Math.max(a[0], b[0]), Math.min(a[1], b[1])];
      case 'onlyOn': return a || b;
    }
    return a;
  }, null);
}

function resolveRule(groupId, key){
  if (!groupId) return null;
  const chain = pathOf(groupId);            /* root first */
  let win = null, lock = null; const blocked = [];
  chain.forEach(g => {
    const a = S.attach[g.id] && S.attach[g.id][key];
    if (!a) return;
    if (lock && lock.mode === 'exact'){
      blocked.push({ group:g, value:a.value, why:'locked exactly by ' + lock.name }); return;
    }
    if (lock && lock.mode === 'tighten' && win && !isTighter(key, a.value, win.value)){
      blocked.push({ group:g, value:a.value, why:'would loosen a rule locked by ' + lock.name }); return;
    }
    win = { value:a.value, srcId:g.id, srcName:g.name, own: g.id === groupId };
    if (a.lock && a.lock !== 'open') lock = { id:g.id, name:g.name, mode:a.lock };
  });
  return win ? Object.assign(win, { lock, blocked }) : null;
}
function effectivePolicy(groupId){
  const out = {};
  RULES.forEach(r => out[r.key] = resolveRule(groupId, r.key));
  return out;
}
/* A strict-looking rule that governs a quarter of the vehicles while reporting
   "enforcing" is a false assurance of safety, so we count what it misses. */
function inactiveFor(groupId, key){
  const need = RULE_BY_KEY[key].needs;
  if (!need) return 0;
  return vehiclesIn(groupId, true).filter(v => v[need] == null).length;
}

/* ── The shared asset ──────────────────────────────────────────────────── */
function activeLoan(vehicleId){ return S.loans.find(l => l.vehicleId === vehicleId && l.active) || null; }

function operatingChain(vehicle, driver, ctx){
  ctx = ctx || {};
  const loan = activeLoan(vehicle.id);
  const steps = [
    { label:'Job or cost-centre code at the pump', gid: ctx.jobGroupId || null, miss:'not entered' },
    { label:'Geofence', gid: ctx.geoGroupId || null, miss:'no match' },
    { label:'Active loan or reservation', gid: loan ? loan.groupId : null, miss:'none' },
    { label:"Driver's home group", gid: driver ? driver.homeId : null, miss:'no driver identified' },
    { label:"Vehicle's home group", gid: vehicle.homeId, miss:'not set' },
  ];
  let found = false;
  steps.forEach(s => {
    if (found) { s.state = 'unused'; return; }
    if (s.gid) { s.state = 'won'; found = true; } else { s.state = 'lost'; }
  });
  return steps;
}

/* Rule class picks which group is authoritative. The applied value is the
   strictest of the three, so a loose sibling can never be used as an escape. */
function resolveForFill(vehicle, driver, ctx){
  const chain = operatingChain(vehicle, driver, ctx);
  const operating = chain.find(s => s.state === 'won');
  const payingId = operating ? operating.gid : vehicle.homeId;
  const out = { payingId, chain, rules:{} };
  RULES.forEach(r => {
    const fromVehicle = resolveRule(vehicle.homeId, r.key);
    const fromDriver  = driver ? resolveRule(driver.homeId, r.key) : null;
    const fromPaying  = resolveRule(payingId, r.key);
    const authoritative = r.cls === 'asset' ? fromVehicle : r.cls === 'person' ? fromDriver : fromPaying;
    const applied = strictest(r.key, [fromVehicle && fromVehicle.value,
                                      fromDriver && fromDriver.value,
                                      fromPaying && fromPaying.value]);
    const tightened = authoritative && !sameValue(r.key, applied, authoritative.value);
    out.rules[r.key] = { fromVehicle, fromDriver, fromPaying, authoritative, applied, tightened };
  });
  return out;
}
function sameValue(key, a, b){
  if (a == null || b == null) return a === b;
  return JSON.stringify(a) === JSON.stringify(b);
}

/* ── Simulation ────────────────────────────────────────────────────────── */
/* Nothing else makes a cascading policy trustworthy before you switch it on. */
function simulate(groupId){
  reseed();
  const vs = vehiclesIn(groupId, true);
  const sample = vs.slice(0, 400);
  let fills = 0, declines = 0; const reasons = {};
  sample.forEach(v => {
    const eff = effectivePolicy(v.homeId);
    for (let i = 0; i < 8; i++){
      fills++;
      /* Real fuelling clusters in working hours. A uniform spread would put
         a fifth of every fill outside the window and make the check look
         broken rather than informative. */
      const hour = rnd() < 0.995 ? 6 + Math.floor(rnd() * 11)
                 : (rnd() < 0.5 ? 4 : 19 + Math.floor(rnd() * 3));
      const litres = Math.round((v.tank || 120) * (0.35 + rnd() * 0.45));
      const value = Math.round(litres * 24.6);
      const fuel = v.fuelType;
      let why = null;
      const w = eff.window && eff.window.value;
      if (w && (hour < w[0] || hour >= w[1])) why = 'Outside the fuelling window';
      else if (eff.products && !eff.products.value.includes(fuel)) why = 'Fuel product not allowed';
      else if (eff.maxValue && value > eff.maxValue.value) why = 'Over the per-fill value limit';
      else if (eff.maxLitres && v.tank && litres > v.tank * eff.maxLitres.value) why = 'Over the litre limit';
      if (why){ declines++; reasons[why] = (reasons[why] || 0) + 1; }
    }
  });
  const scale = vs.length / Math.max(sample.length, 1);
  return {
    fills: Math.round(fills * scale), declines: Math.round(declines * scale),
    pct: fills ? (declines / fills * 100) : 0,
    top: Object.entries(reasons).sort((a,b) => b[1] - a[1]).slice(0,3)
           .map(([why, n]) => [why, Math.round(n * scale)]),
    sampled: sample.length, of: vs.length,
  };
}

/* ── Undo ──────────────────────────────────────────────────────────────── */
/* Every structural mutation is reversible. A delete that silently takes 340
   descendants with it is the difference between a tool and a hazard. */
function snapshot(label){
  S.undo.push({
    label,
    groups: JSON.parse(JSON.stringify(S.groups)),
    attach: JSON.parse(JSON.stringify(S.attach)),
    homes: S.account.vehicles.map(v => v.homeId),
    dhomes: S.account.drivers.map(d => d.homeId),
    shared: S.account.vehicles.map(v => v.sharedWith.slice()),
    loans: JSON.parse(JSON.stringify(S.loans)),
  });
  if (S.undo.length > 24) S.undo.shift();
}
function undo(){
  const u = S.undo.pop(); if (!u) return false;
  S.groups = u.groups; S.attach = u.attach; S.loans = u.loans;
  S.account.vehicles.forEach((v, i) => { v.homeId = u.homes[i]; v.sharedWith = u.shared[i]; });
  S.account.drivers.forEach((d, i) => d.homeId = u.dhomes[i]);
  if (!byId(S.selectedGroup)) S.selectedGroup = rootGroup() && rootGroup().id;
  return u.label;
}

/* ── Formatting ────────────────────────────────────────────────────────── */
const pad2 = n => String(n).padStart(2, '0');
const zar = n => 'R' + Number(n).toLocaleString('en-ZA');
const num = n => Number(n).toLocaleString('en-ZA');
function fmtValue(key, v){
  if (v == null) return 'Not set';
  switch (RULE_BY_KEY[key].type){
    case 'set':    return v.length ? v.join(' and ') : 'None allowed';
    case 'litres': return v + '× tank capacity';
    case 'window': return pad2(v[0]) + ':00 to ' + pad2(v[1]) + ':00';
    case 'bool':   return v ? 'Required' : 'Not required';
    case 'rand':   return zar(v);
  }
  return String(v);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);

function announce(msg){ el('announcer').textContent = ''; setTimeout(() => el('announcer').textContent = msg, 30); }

let toastTimer = null;
function toast(msg, undoLabel){
  const t = el('toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' +
    (undoLabel ? '<button class="a-toast__undo" type="button" id="toastUndo">Undo</button>' : '');
  t.dataset.state = 'on';
  if (undoLabel) el('toastUndo').onclick = () => {
    const label = undo(); t.dataset.state = 'off';
    if (label){ renderAll(); announce(label + ' undone'); }
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.dataset.state = 'off', 10000);
  announce(msg);
}

let lastFocus = null;
function openDialog(title, body, foot){
  lastFocus = document.activeElement;
  el('dialog').innerHTML =
    '<div class="o-dialog__head"><h2 class="o-dialog__title" id="dialogTitle">' + title + '</h2></div>' +
    '<div class="o-dialog__body">' + body + '</div>' +
    '<div class="o-dialog__foot">' + foot + '</div>';
  el('scrim').dataset.state = 'on';
  el('dialog').focus();
}
function closeDialog(){
  el('scrim').dataset.state = 'off';
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
}
el('scrim').addEventListener('click', e => { if (e.target === el('scrim')) closeDialog(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeDialog(); el('pop').hidden = true; }
  /* Undo is a global. Nothing structural happens that cannot be taken back. */
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey){
    const t = e.target.tagName;
    if (t !== 'INPUT' && t !== 'TEXTAREA'){
      e.preventDefault();
      const label = undo();
      if (label){ renderAll(); toast(label + ' undone'); } else toast('Nothing left to undo');
    }
  }
});

/* ── Provenance chip. Colour is never the only carrier. ────────────────── */
/* Tighten-only is not locked. A rule this group successfully overrode must
   read as its own, with the ceiling shown beside it, or the two lock modes
   become indistinguishable and the whole point of having both is lost. */
function sourceChip(res, groupId){
  if (!res) return '<span class="a-chip" data-source="default">Not set</span>';
  const above = res.lock && res.lock.id !== groupId;
  if (above && res.lock.mode === 'exact')
    return '<span class="a-chip" data-source="locked">🔒 Locked by ' + esc(res.lock.name) + '</span>';
  const own = res.srcId === groupId
    ? '<span class="a-chip" data-source="here">Set here</span>'
    : '<span class="a-chip" data-source="inherited">Inherited from ' + esc(res.srcName) + '</span>';
  return own + (above
    ? ' <span class="a-chip" data-source="locked">Tighten only, from ' + esc(res.lock.name) + '</span>' : '');
}

/* ── Rule rows, shared by Simple mode and the inspector ────────────────── */
function ruleRows(groupId, opts){
  opts = opts || {};
  return RULES.map(r => {
    const res = resolveRule(groupId, r.key);
    const dead = inactiveFor(groupId, r.key);
    const lockedAbove = res && res.lock && res.lock.id !== groupId && res.lock.mode === 'exact';
    const own = res && res.srcId === groupId;
    return '<div class="m-rule' + (opts.tight ? ' m-rule--tight' : '') + '" data-state="' + (dead ? 'blocked' : 'idle') + '">' +
      '<span class="m-rule__label">' + esc(r.label) +
        (opts.showClass ? '<span class="m-rule__class">' + esc(CLS_LABEL[r.cls]) + '</span>' : '') +
      '</span>' +
      '<span class="m-rule__value">' + esc(fmtValue(r.key, res && res.value)) + '</span>' +
      (opts.showSource === false ? '<span class="m-rule__src"></span>'
                                 : '<span class="m-rule__src">' + sourceChip(res, groupId) + '</span>') +
      '<span class="m-rule__act">' +
        (lockedAbove ? '' :
          '<button class="a-btn a-btn--xs a-btn--secondary" type="button" data-act="edit-rule" data-rule="' + r.key + '">' +
          (own ? 'Change' : 'Override') + '</button>') +
        (own && byId(groupId).parentId ?
          '<button class="a-btn a-btn--xs a-btn--quiet" type="button" data-act="reset-rule" data-rule="' + r.key + '">Reset</button>' : '') +
      '</span>' +
      (dead ?
        '<div style="grid-column:1/-1;font-size:var(--text-micro);color:var(--color-warning);padding-top:2px">' +
        'Inactive for ' + num(dead) + ' of ' + num(vehiclesIn(groupId, true).length) +
        ' vehicles: ' + (RULE_BY_KEY[r.key].needs === 'tank' ? 'tank capacity missing' : 'fuel type missing') +
        ' · <button class="a-link" type="button" data-act="fix-missing" data-rule="' + r.key + '">Fix</button></div>' : '') +
      '</div>';
  }).join('');
}

/* ── D · Structure workspace ───────────────────────────────────────────── */
let treeFocusId = null;
let treeFilter = '';

function matchesFilter(g){
  if (!treeFilter) return true;
  const q = treeFilter.toLowerCase();
  if (g.name.toLowerCase().includes(q)) return true;
  return descendants(g.id).some(d => d.name.toLowerCase().includes(q));
}

function renderTree(){
  const root = rootGroup();
  if (!root){ el('treeHost').innerHTML = ''; return; }
  if (!treeFocusId || !byId(treeFocusId)) treeFocusId = S.selectedGroup || root.id;

  const node = (g, pos, size, level) => {
    const kids = childrenOf(g.id).filter(matchesFilter);
    const open = S.expanded.has(g.id) || (treeFilter && kids.length);
    const nV = vehiclesIn(g.id, true).length;
    const eff = S.attach[g.id] ? 'here' : 'inherited';
    const deep = depthOf(g.id);
    return '<li class="o-tree__item" role="treeitem" id="tn-' + g.id + '" data-id="' + g.id + '"' +
        ' aria-level="' + level + '" aria-posinset="' + pos + '" aria-setsize="' + size + '"' +
        (kids.length ? ' aria-expanded="' + (open ? 'true' : 'false') + '"' : '') +
        ' aria-selected="' + (S.selectedGroup === g.id ? 'true' : 'false') + '"' +
        ' tabindex="' + (treeFocusId === g.id ? '0' : '-1') + '"' +
        (g.parentId ? ' draggable="true"' : '') + '>' +
      '<div class="o-tree__row" style="padding-left:' + (level - 1) * 18 + 'px">' +
        '<button class="o-tree__twist" type="button" tabindex="-1" aria-hidden="true"' +
          ' data-act="twist" data-id="' + g.id + '"' +
          ' data-state="' + (kids.length ? (open ? 'open' : 'shut') : 'leaf') + '">▶</button>' +
        '<span class="o-tree__main">' +
          '<span class="o-tree__name">' + esc(g.name) + '</span>' +
          '<span class="o-tree__sub">' +
            (g.system ? '<span class="a-chip" data-tone="warning">Holding</span>' :
                        '<span class="a-kind">' + esc(kindOf(g)) + '</span>') +
            (S.attach[g.id] ? '<span class="a-chip" data-source="here" title="Rules set on this group">Rules</span>' : '') +
          '</span>' +
        '</span>' +
        '<span class="o-tree__meta">' +
          '<span class="a-count" title="' + num(nV) + ' vehicles">' + num(nV) + '</span>' +
          '<button class="o-tree__more" type="button" tabindex="-1" data-act="node-menu" data-id="' + g.id +
            '" aria-label="Actions for ' + esc(g.name) + '">⋯</button>' +
        '</span>' +
      '</div>' +
      (kids.length && open ? '<ul role="group">' +
        kids.map((c, i) => node(c, i + 1, kids.length, level + 1)).join('') + '</ul>' : '') +
      '</li>';
  };

  el('treeHost').innerHTML =
    '<ul class="o-tree" role="tree" aria-label="Group structure" id="treeRoot">' +
    node(root, 1, 1, 1) + '</ul>';

  el('treeFoot').innerHTML =
    '<div style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--text-micro);color:var(--color-text-tertiary)">' +
      '<span>' + S.groups.length + ' groups · ' + (Math.max(...S.groups.map(g => depthOf(g.id))) + 1) + ' levels deep</span>' +
      '<button class="a-btn a-btn--xs a-btn--quiet" type="button" data-act="tree-help" style="margin-left:auto">Keys</button>' +
    '</div>';

  renderFlat();
}

/* Keyboard. Tab is never rebound: Tab is the fire exit. */
let typeBuf = '', typeAt = 0;
function visibleNodes(){
  return [...document.querySelectorAll('#treeRoot [role="treeitem"]')];
}
function focusNode(id){
  treeFocusId = id;
  visibleNodes().forEach(n => n.tabIndex = n.dataset.id === id ? 0 : -1);
  const n = document.getElementById('tn-' + id);
  if (n) n.focus();
}
function onTreeKey(e){
  const item = e.target.closest('[role="treeitem"]'); if (!item) return;
  const id = item.dataset.id, g = byId(id);
  const list = visibleNodes(), i = list.indexOf(item);
  const kids = childrenOf(id);
  const open = S.expanded.has(id);
  const K = e.key;

  if (K === 'ArrowDown'){ e.preventDefault(); if (list[i+1]) focusNode(list[i+1].dataset.id); }
  else if (K === 'ArrowUp'){ e.preventDefault(); if (list[i-1]) focusNode(list[i-1].dataset.id); }
  else if (K === 'ArrowRight'){
    e.preventDefault();
    if (kids.length && !open){ S.expanded.add(id); renderTree(); focusNode(id); }
    else if (kids.length && list[i+1]) focusNode(list[i+1].dataset.id);
  }
  else if (K === 'ArrowLeft'){
    e.preventDefault();
    if (kids.length && open){ S.expanded.delete(id); renderTree(); focusNode(id); }
    else if (g.parentId) focusNode(g.parentId);
  }
  else if (K === 'Home'){ e.preventDefault(); focusNode(list[0].dataset.id); }
  else if (K === 'End'){ e.preventDefault(); focusNode(list[list.length-1].dataset.id); }
  else if (K === 'Enter' || K === ' '){ e.preventDefault(); selectGroup(id); }
  else if ((e.metaKey || e.ctrlKey) && K.toLowerCase() === 'x'){ e.preventDefault(); cutId = id; toast('Cut ' + g.name + '. Move to a group and press Cmd V.'); }
  else if ((e.metaKey || e.ctrlKey) && K.toLowerCase() === 'v'){ e.preventDefault(); if (cutId) tryMove(cutId, id); }
  else if (K.length === 1 && /\S/.test(K) && !e.metaKey && !e.ctrlKey){
    const now = Date.now(); typeBuf = (now - typeAt < 800) ? typeBuf + K : K; typeAt = now;
    const hit = list.find(n => byId(n.dataset.id).name.toLowerCase().startsWith(typeBuf.toLowerCase()));
    if (hit) focusNode(hit.dataset.id);
  }
}
let cutId = null;

function selectGroup(id){
  S.selectedGroup = id;
  renderTree(); renderRecords(); renderInspector();
  announce(byId(id).name + ' selected, ' + num(vehiclesIn(id, true).length) + ' vehicles');
}

/* ── Move: preview the blast radius, then commit, then allow undo ──────── */
function policyDiff(nodeId, newParentId){
  const before = effectivePolicy(nodeId);
  const saveParent = byId(nodeId).parentId;
  byId(nodeId).parentId = newParentId;
  const after = effectivePolicy(nodeId);
  byId(nodeId).parentId = saveParent;
  const rows = [];
  RULES.forEach(r => {
    const b = before[r.key], a = after[r.key];
    const bv = b && b.value, av = a && a.value;
    if (!sameValue(r.key, bv, av)) rows.push({ rule:r, from:bv, to:av });
    else if ((a && a.lock ? 1 : 0) !== (b && b.lock ? 1 : 0)) rows.push({ rule:r, from:bv, to:av, lockOnly:true });
  });
  return rows;
}

function tryMove(nodeId, targetId){
  const g = byId(nodeId), t = byId(targetId);
  if (!g || !t) return;
  if (!canMoveUnder(nodeId, targetId)){
    /* Never a silent no-op. The refusal explains itself, where it happened. */
    toast(nodeId === targetId ? 'A group cannot go inside itself'
      : g.parentId === null ? 'The top group cannot be moved'
      : 'That would put ' + g.name + ' inside its own branch');
    return;
  }
  const depthAfter = depthOf(targetId) + 1 + Math.max(0, ...descendants(nodeId).map(d => depthOf(d.id) - depthOf(nodeId)));
  const diff = policyDiff(nodeId, targetId);
  const nV = vehiclesIn(nodeId, true).length;
  const nG = descendants(nodeId).length;

  openDialog('Move ' + esc(g.name) + ' into ' + esc(t.name) + '?',
    '<p style="margin:0 0 var(--sp-3);font-size:var(--text-small)">' +
      'This moves <strong>' + num(nV) + ' vehicles</strong>' + (nG ? ' and <strong>' + num(nG) + ' groups beneath it</strong>' : '') + '.</p>' +
    (depthAfter > 4 ?
      '<div class="m-note" data-tone="warning" style="margin-bottom:var(--sp-3)"><span class="m-note__ico">△</span>' +
      '<span>That puts this branch ' + (depthAfter + 1) + ' levels deep. Deep structures go stale. ' +
      'A label such as <span class="a-tag"><span class="a-tag__k">site</span><span class="a-tag__v">' + esc(g.name) +
      '</span></span> often does the same job and survives a reorganisation.</span></div>' : '') +
    (diff.length ?
      '<h3 style="font-size:var(--text-caption);text-transform:uppercase;letter-spacing:0.04em;color:var(--color-text-secondary);margin:0 0 var(--sp-2)">' +
        diff.length + ' rule' + (diff.length === 1 ? '' : 's') + ' change for those ' + num(nV) + ' vehicles</h3>' +
      '<div>' + diff.map(d =>
        '<div class="m-rule"><span class="m-rule__label">' + esc(d.rule.label) + '</span>' +
        '<span class="m-rule__value" style="color:var(--color-text-tertiary);text-decoration:line-through">' +
          esc(fmtValue(d.rule.key, d.from)) + '</span>' +
        '<span class="m-rule__value" style="color:var(--color-warning)">' + esc(fmtValue(d.rule.key, d.to)) + '</span>' +
        '<span></span></div>').join('') + '</div>'
      : '<div class="m-note" data-tone="success"><span class="m-note__ico">✓</span><span>No rules change.</span></div>'),

    '<button class="a-btn a-btn--quiet" type="button" data-act="close">Cancel</button>' +
    (diff.length ? '<button class="a-btn a-btn--secondary" type="button" data-act="move-neutral" data-id="' + nodeId +
      '" data-to="' + targetId + '">Move and keep today\'s rules</button>' : '') +
    '<button class="a-btn a-btn--primary" type="button" data-act="move-go" data-id="' + nodeId +
      '" data-to="' + targetId + '">Move</button>');
}

function doMove(nodeId, targetId, pinPolicy){
  snapshot('Moved ' + byId(nodeId).name);
  if (pinPolicy){
    /* Pin the current effective policy onto the moved node so a restructure
       does not silently repoint 300 vehicles at a stricter parent. */
    const eff = effectivePolicy(nodeId);
    S.attach[nodeId] = S.attach[nodeId] || {};
    RULES.forEach(r => { if (eff[r.key] && !S.attach[nodeId][r.key])
      S.attach[nodeId][r.key] = { value: eff[r.key].value, lock:'open' }; });
  }
  byId(nodeId).parentId = targetId;
  S.expanded.add(targetId);
  cutId = null;
  closeDialog(); renderAll();
  toast('Moved ' + byId(nodeId).name + ' into ' + byId(targetId).name, true);
}
