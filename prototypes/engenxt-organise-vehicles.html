<!DOCTYPE html>
<html lang="en-ZA" data-theme="light" data-motion="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EngenXT · Settings</title>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   ENGENXT · SETTINGS
   A faithful copy of Linear's settings pages, because they have already
   solved this problem and solved it simply.

   What we are copying, and why:
     · Settings pages, not a wizard. There is no onboarding flow for this
       in Linear and there does not need to be one here.
     · Nesting is a field on a form, not a tree editor. "Sits inside" is a
       dropdown, exactly like Linear's Team hierarchy > parent.
     · Depth caps at 5, the same as Linear's sub-teams.
     · Tag groups nest one level and are single-select, exactly like
       Linear's label groups: you apply a tag from the group, never the
       group itself.
     · A plain list, a New button top right, actions on the row.

   Naming: a- atoms, m- molecules, o- organisms, t- templates.
   State is an attribute, never a class: data-state, data-tone.
   ══════════════════════════════════════════════════════════════════════════ */

:root {
  --brand:      #1650B8;
  --brand-dark: #0D3A8A;
  --brand-tint: #EEF3FF;
  --red:        #E2231A;

  --ink:   #16181D;
  --ink-2: #6B6F76;
  --ink-3: #8A8F98;
  --ink-4: #B4B8BF;

  --bg:      #ffffff;
  --bg-side: #FAFBFC;
  --bg-sunk: #F4F5F8;
  --bg-hov:  #F7F8FA;
  --line:    #E6E8EB;
  --line-2:  #EFF1F3;
  --scrim:   rgba(22,24,29,0.40);

  --ok:   #1F8A4C; --ok-bg:   #EAF6EF;
  --warn: #A6620A; --warn-bg: #FDF3E6;
  --bad:  #C0392B; --bad-bg:  #FCEDEB;

  --focus: #0D3A8A;

  --font: -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "Menlo", monospace;

  /* Linear runs small and tight. */
  --t-page:  22px;
  --t-h:     15px;
  --t-body:  14px;
  --t-sm:    13px;
  --t-xs:    12px;
  --t-2xs:   11px;

  --r-lg: 10px; --r-md: 8px; --r-sm: 6px; --r-xs: 4px; --r-pill: 999px;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 48px;
  --s1h: 6px; --s2h: 10px;

  --row: 44px;
  --ease: cubic-bezier(.16,1,.3,1);
  --dur: .15s;

  --sh-pop: 0 0 0 1px rgba(22,24,29,.06), 0 8px 24px rgba(22,24,29,.12);
  --sh-mod: 0 0 0 1px rgba(22,24,29,.06), 0 24px 64px rgba(22,24,29,.20);
}
[data-theme="dark"] {
  --brand: #7B9CF5; --brand-dark: #A8C4F8; --brand-tint: #1A2438;
  --ink: #EDEEF0; --ink-2: #9598A1; --ink-3: #7A7D87; --ink-4: #5C5F68;
  --bg: #101114; --bg-side: #0B0C0E; --bg-sunk: #1A1C20; --bg-hov: #1A1C20;
  --line: #26282D; --line-2: #1E2024; --scrim: rgba(0,0,0,.6);
  --ok: #4CC38A; --ok-bg: #10281C; --warn: #E9A23B; --warn-bg: #2A1D0C; --bad: #E5484D; --bad-bg: #2A1315;
  --focus: #A8C4F8;
  --sh-pop: 0 0 0 1px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.5);
  --sh-mod: 0 0 0 1px rgba(255,255,255,.08), 0 24px 64px rgba(0,0,0,.6);
}

*,*::before,*::after { box-sizing:border-box; }
html,body { height:100%; }
body { margin:0; font-family:var(--font); font-size:var(--t-body); line-height:1.5;
       color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
       letter-spacing:-.006em; }
button,input,select,textarea { font:inherit; color:inherit; letter-spacing:inherit; }
:focus-visible { outline:2px solid var(--focus); outline-offset:1px; border-radius:var(--r-xs); }
:focus:not(:focus-visible) { outline:none; }
.vh { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.num { font-variant-numeric:tabular-nums; }
.quiet { color:var(--ink-2); }
.trunc { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ transition-duration:.001ms!important; animation-duration:.001ms!important; } }
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after { transition-duration:.001ms!important; }

/* ── atoms ─────────────────────────────────────────────────────────────── */
.a-btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--s1h);
         height:32px; padding:0 var(--s3); position:relative;
         border:1px solid var(--line); border-radius:var(--r-sm); background:var(--bg);
         font-size:var(--t-sm); font-weight:500; cursor:pointer; white-space:nowrap;
         transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.a-btn::after { content:''; position:absolute; inset:-6px -2px; }   /* 44px hit area */
.a-btn:hover:not(:disabled) { background:var(--bg-hov); }
.a-btn:disabled { opacity:.4; cursor:not-allowed; }
.a-btn--go { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:500; }
[data-theme="dark"] .a-btn--go { color:#0B0C0E; }
.a-btn--go:hover:not(:disabled) { background:var(--brand-dark); border-color:var(--brand-dark); }
.a-btn--bare { border-color:transparent; background:transparent; color:var(--ink-2); }
.a-btn--bare:hover:not(:disabled) { background:var(--bg-hov); color:var(--ink); }
.a-btn--risk { color:var(--bad); }
.a-btn--risk:hover:not(:disabled) { background:var(--bad-bg); }
.a-btn--sm { height:26px; padding:0 var(--s2); font-size:var(--t-xs); }
.a-btn--icon { width:28px; padding:0; color:var(--ink-3); border-color:transparent; background:transparent; }
.a-btn--icon:hover { background:var(--bg-hov); color:var(--ink); }

.a-in, .a-sel { width:100%; height:34px; padding:0 var(--s2h);
                border:1px solid var(--line); border-radius:var(--r-sm);
                background:var(--bg); color:var(--ink); font-size:var(--t-body); }
.a-in:focus, .a-sel:focus { border-color:var(--brand); outline:none; box-shadow:0 0 0 3px var(--brand-tint); }
textarea.a-in { height:auto; padding:var(--s2); line-height:1.5; resize:vertical; }
.a-check { width:15px; height:15px; accent-color:var(--brand); cursor:pointer; flex:none; }

.a-dot { width:10px; height:10px; border-radius:50%; flex:none; display:inline-block; }
.a-chip { display:inline-flex; align-items:center; gap:var(--s1); height:20px; padding:0 var(--s1h);
          border:1px solid var(--line); border-radius:var(--r-xs); background:var(--bg-sunk);
          color:var(--ink-2); font-size:var(--t-2xs); font-weight:500; white-space:nowrap; }
.a-chip[data-tone="warn"] { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.a-chip[data-tone="ok"]   { background:var(--ok-bg);   color:var(--ok);   border-color:transparent; }
.a-count { min-width:48px; text-align:right; color:var(--ink-3); font-size:var(--t-sm);
           font-variant-numeric:tabular-nums; }

/* ── the settings shell ────────────────────────────────────────────────── */
.t-app { display:grid; grid-template-columns:224px minmax(0,1fr); height:100vh; height:100dvh; }
.o-side { display:flex; flex-direction:column; background:var(--bg-side);
          border-right:1px solid var(--line); padding:var(--s5) var(--s3); overflow-y:auto; }
/* Prototype-only controls live at the bottom, fenced off, so nobody
   mistakes Clear for a filter and loses their work. */
.o-side__foot { margin-top:auto; padding-top:var(--s5); border-top:1px solid var(--line); }
.o-side__brand { padding:0 var(--s2) var(--s5);
                 font-size:var(--t-h); font-weight:650; letter-spacing:-.02em; }
.o-side__brand em { font-style:normal; color:var(--red); }
.o-side__h { margin:var(--s5) 0 var(--s1); padding:0 var(--s2);
             font-size:var(--t-2xs); font-weight:600; color:var(--ink-3); letter-spacing:.02em; }
.o-side__l { list-style:none; margin:0; padding:0; }
.o-side__b { display:flex; align-items:center; gap:var(--s2); width:100%; height:30px;
             padding:0 var(--s2); margin-bottom:1px; position:relative;
             border:0; border-radius:var(--r-sm); background:none; cursor:pointer;
             color:var(--ink-2); font-size:var(--t-sm); font-weight:500; text-align:left; }
.o-side__b::after { content:''; position:absolute; inset:-7px -2px; }
.o-side__b:hover { background:var(--bg-hov); color:var(--ink); }
.o-side__b[aria-current="true"] { background:var(--bg-sunk); color:var(--ink); font-weight:550; }
.o-side__i { flex:none; width:16px; text-align:center; color:var(--ink-3); font-size:var(--t-xs); }
.o-side__b[aria-current="true"] .o-side__i { color:var(--ink); }
.o-side__sw { display:flex; flex-wrap:wrap; gap:var(--s1); padding:var(--s1) var(--s2) 0; }
.o-side__chip { height:26px; padding:0 var(--s2); position:relative;
                border:1px solid var(--line); border-radius:var(--r-pill); background:var(--bg);
                color:var(--ink-2); font-size:var(--t-2xs); font-weight:500; cursor:pointer; }
.o-side__chip::after { content:''; position:absolute; inset:-9px -2px; }
.o-side__chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.o-side__note { margin:var(--s2) 0 0; padding:0 var(--s2); font-size:var(--t-2xs);
                color:var(--ink-3); line-height:1.5; }

/* Content: one narrow column, left aligned, generous air. Linear's settings
   pane is ~640px and never stretches. */
.t-main { overflow-y:auto; }
.t-col { max-width:660px; margin:0 auto; padding:var(--s8) var(--s6) var(--s8); }
.o-head { margin-bottom:var(--s6); }
.o-head h1 { margin:0 0 var(--s1); font-size:var(--t-page); font-weight:600; letter-spacing:-.02em; }
.o-head p  { margin:0; font-size:var(--t-sm); color:var(--ink-2); max-width:56ch; }

.o-bar { display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2);
         padding-bottom:var(--s2); border-bottom:1px solid var(--line); }
.o-bar h2 { margin:0; font-size:var(--t-body); font-weight:600; }
.o-bar__n { color:var(--ink-3); font-size:var(--t-sm); font-variant-numeric:tabular-nums; }

/* A row. No card, no shadow. A hairline, a hover, and actions on the right. */
.m-row { display:flex; align-items:center; gap:var(--s3); min-height:var(--row);
         padding:var(--s2) var(--s2); border-radius:var(--r-sm); }
.m-row + .m-row { border-top:1px solid var(--line-2); }
.m-row:hover { background:var(--bg-hov); }
.m-row__m { flex:1 1 auto; min-width:0; }
.m-row__n { display:block; font-size:var(--t-body); font-weight:500; }
.m-row__s { display:block; font-size:var(--t-xs); color:var(--ink-3); }
.m-row__a { flex:none; display:flex; align-items:center; gap:var(--s1); }
/* Actions fade in on hover but never disappear for keyboard or touch. */
.m-row__a > .a-btn--sm, .m-row__a > .a-btn--icon { opacity:.55; transition:opacity var(--dur); }
.m-row:hover .m-row__a > *, .m-row__a > *:focus-visible { opacity:1; }
@media (pointer:coarse){ .m-row__a > * { opacity:1 !important; } }

/* A tag group and its tags, indented one level. Linear nests labels exactly
   one deep and no further. */
.m-tg { padding:var(--s2) 0; }
.m-tg + .m-tg { border-top:1px solid var(--line-2); }
.m-tg__h { display:flex; align-items:center; gap:var(--s2); min-height:32px; padding:0 var(--s2); }
.m-tg__n { font-size:var(--t-body); font-weight:550; }
.m-tg__l { margin:var(--s1) 0 0; padding:0 0 0 var(--s6); list-style:none; }
.m-tg__i { display:flex; align-items:center; gap:var(--s2); min-height:30px; padding:0 var(--s2);
           border-radius:var(--r-sm); font-size:var(--t-sm); }
.m-tg__i:hover { background:var(--bg-hov); }

.m-empty { display:flex; flex-direction:column; align-items:center; gap:var(--s2);
            padding:var(--s8) var(--s4); text-align:center;
            border:1px dashed var(--line); border-radius:var(--r-lg); }
.m-empty__g { display:grid; place-items:center; width:40px; height:40px; margin-bottom:var(--s1);
              border-radius:var(--r-md); background:var(--bg-sunk); color:var(--ink-3); font-size:var(--t-h); }
.m-empty h3 { margin:0; font-size:var(--t-h); font-weight:600; }
.m-empty p  { margin:0 auto; max-width:42ch; font-size:var(--t-sm); color:var(--ink-2); }
.m-empty__a { display:flex; gap:var(--s2); flex-wrap:wrap; justify-content:center; margin-top:var(--s3); }

.m-note { display:flex; gap:var(--s2); padding:var(--s2h) var(--s3); border-radius:var(--r-sm);
          background:var(--bg-sunk); font-size:var(--t-xs); color:var(--ink-2); line-height:1.55; }
.m-note i { font-style:normal; flex:none; }
.m-note strong { color:var(--ink); font-weight:600; }

.m-field { display:block; margin-bottom:var(--s4); }
.m-field__l { display:block; margin-bottom:var(--s1h); font-size:var(--t-sm); font-weight:500; }
.m-field__h { display:block; margin-top:var(--s1h); font-size:var(--t-xs); color:var(--ink-3); }

/* Vehicles: a plain table that scrolls in its own box. */
.o-tbl { width:100%; min-width:520px; border-collapse:collapse; font-size:var(--t-sm); }
.o-tbl th { position:sticky; top:0; z-index:1; text-align:left; font-weight:500; white-space:nowrap;
            padding:var(--s2); background:var(--bg); color:var(--ink-3);
            border-bottom:1px solid var(--line); font-size:var(--t-xs); }
.o-tbl td { padding:var(--s2); border-bottom:1px solid var(--line-2); white-space:nowrap; }
.o-tbl tr:hover td { background:var(--bg-hov); }
.o-scroll { overflow:auto; max-height:52vh; }
.o-selbar { display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3);
            padding:var(--s2) var(--s3); border-radius:var(--r-sm); background:var(--bg-sunk); }

/* The scent to the next task. Reads as a thing to do, not a warning. */
.o-next { display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
          margin-bottom:var(--s4); padding:var(--s3) var(--s4);
          border:1px solid var(--line); border-radius:var(--r-md);
          background:var(--bg-sunk); cursor:pointer;
          transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
.o-next:hover { border-color:var(--brand); background:var(--brand-tint); }
.o-next__m { flex:1 1 auto; min-width:0; }
.o-next__m strong { display:block; font-size:var(--t-body); font-weight:600; }
.o-next__m span  { display:block; font-size:var(--t-xs); color:var(--ink-2); }
.o-next__a { flex:none; font-size:var(--t-sm); font-weight:600; color:var(--brand); }

.o-filters { display:flex; gap:var(--s2); margin-bottom:var(--s3); flex-wrap:wrap; }
.o-filters .a-in { flex:1 1 220px; min-width:0; }
.o-filters .a-sel { flex:0 1 240px; min-width:0; }

.o-menu { display:flex; flex-direction:column; gap:var(--s1); }
.o-menu .a-btn { justify-content:flex-start; height:36px; }

/* ── overlays ──────────────────────────────────────────────────────────── */
.o-scrim { position:fixed; inset:0; background:var(--scrim); z-index:40; display:grid;
           place-items:center; padding:var(--s5); opacity:0; pointer-events:none;
           transition:opacity var(--dur) var(--ease); }
.o-scrim[data-state="on"] { opacity:1; pointer-events:auto; }
.o-mod { width:min(440px,100%); background:var(--bg); border-radius:var(--r-lg); box-shadow:var(--sh-mod); }
.o-mod__h { padding:var(--s5) var(--s5) var(--s3); }
.o-mod__h h2 { margin:0; font-size:var(--t-h); font-weight:600; }
.o-mod__b { padding:0 var(--s5) var(--s4); }
.o-mod__f { display:flex; justify-content:flex-end; gap:var(--s2); padding:var(--s3) var(--s5);
            border-top:1px solid var(--line-2); }

.a-toast { position:fixed; left:50%; bottom:var(--s6); transform:translate(-50%,10px); z-index:60;
           display:flex; align-items:center; gap:var(--s3); padding:var(--s2h) var(--s3);
           background:var(--ink); color:var(--bg); border-radius:var(--r-md);
           box-shadow:var(--sh-pop); font-size:var(--t-sm); opacity:0; pointer-events:none;
           transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.a-toast[data-state="on"] { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
.a-toast button { background:none; border:0; cursor:pointer; color:inherit; font-weight:600;
                  font-size:var(--t-sm); text-decoration:underline; text-underline-offset:3px; opacity:.85; }

@media (max-width:820px){
  .t-app { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
  .o-side { border-right:0; border-bottom:1px solid var(--line); max-height:180px; }
  .t-col { padding:var(--s6) var(--s4); }
}
</style>
</head>
<body>
<div class="t-app">
  <nav class="o-side" aria-label="Settings">
    <div class="o-side__brand">Engen<em>XT</em></div>
    <ul class="o-side__l" id="nav"></ul>
    <div class="o-side__foot">
      <h2 class="o-side__h">Prototype</h2>
      <div class="o-side__sw" role="group" aria-label="Prototype controls">
        <button class="o-side__chip" type="button" data-act="example">Fill in data</button>
        <button class="o-side__chip" type="button" data-act="wipe">Clear</button>
        <button class="o-side__chip" type="button" data-mode="theme"  aria-pressed="false">Dark</button>
        <button class="o-side__chip" type="button" data-mode="motion" aria-pressed="false">Reduced motion</button>
      </div>
      <p class="o-side__note" id="dataNote"></p>
    </div>
  </nav>
  <main class="t-main" id="main"><div class="t-col" id="col"></div></main>
</div>

<div class="o-scrim" id="scrim"><div class="o-mod" id="mod" role="dialog" aria-modal="true"
     aria-labelledby="modTitle" tabindex="-1"></div></div>
<div class="a-toast" id="toast" role="status"></div>
<span class="vh" id="say" role="status" aria-live="polite"></span>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   DATA · Takealot Group, already imported
   ══════════════════════════════════════════════════════════════════════════ */
const MAX_DEPTH = 5;               /* Linear's sub-team cap, and ours */
const CLASSES = { 'LDV':80, 'Panel van':70, 'Minibus':60, 'Refrigerated van':90 };
const TAG_COLOURS = ['#5E6AD2','#0F9D58','#D97706','#C0392B','#0E7490','#7C3AED','#BE185D','#4B5563'];

/* name, parent */
const SEED = [
  ['Takealot Group',      null],
  ['Takealot Retail',     'Takealot Group'],
  ['Gauteng',             'Takealot Retail'],
  ['Sandton',             'Gauteng'],
  ['Bryanston',           'Gauteng'],
  ['Western Cape',        'Takealot Retail'],
  ['Cape Town',           'Western Cape'],
  ['Takealot Logistics',  'Takealot Group'],
  ['Kempton Park',        'Takealot Logistics'],
  ['Durban',              'Takealot Logistics'],
  ['Superbalist',         'Takealot Group'],
  ['Midrand',             'Superbalist'],
];
const HOLDS = { 'Sandton':412,'Bryanston':288,'Cape Town':540,'Kempton Park':420,'Durban':290,'Midrand':122 };

let _s = 20260804;
const rnd = () => { _s = (_s*1103515245+12345)&0x7fffffff; return _s/0x7fffffff; };
const pick = a => a[Math.floor(rnd()*a.length)];

/* Nothing is set up. The vehicles and drivers are in, and that is all. */
const S = {
  groups: [], vehicles: [], drivers: 3986, tagGroups: [],
  tags: {}, page: 'groups', filter: '', q: '', tagFilter: null,
  rows: new Set(), undo: [], seq: 0,
};
const uid = p => p + (++S.seq);

/* The import has already happened, so the vehicles exist. None of them is
   in a group yet, because no groups exist yet. */
(function importVehicles(){
  let n = 0;
  const total = Object.values(HOLDS).reduce((a,b)=>a+b,0) + 118;
  for (let i=0;i<total;i++){
    const cls = pick(['LDV','LDV','Panel van','Panel van','Minibus','Refrigerated van']);
    S.vehicles.push({ id:'v'+(++n),
      reg: pick(['JN','BX','HK','TS','CA','ND'])+' '+(10+Math.floor(rnd()*89))+' '+
           pick(['RT','VN','GP','ZL','SD'])+' GP',
      cls, groupId:null });
  }
})();

/* Fills in the worked example, so the populated version is one click away. */
function loadExample(){
  snap('Filled in the example');
  S.groups = []; S.tagGroups = []; S.tags = {}; S.seq = 0;
  const by = {};
  SEED.forEach(([name, parent]) => {
    const g = { id:uid('g'), name, parentId: parent ? by[parent].id : null };
    S.groups.push(g); by[name] = g;
  });
  S.tagGroups = [
    { id:uid('tg'), name:'Shift', tags:[{id:uid('t'),name:'Day',c:1},{id:uid('t'),name:'Night',c:5}] },
    { id:uid('tg'), name:'Vehicle type', tags:Object.keys(CLASSES).map((n,i)=>({id:uid('t'),name:n,c:i})) },
  ];
  const shift = S.tagGroups[0], type = S.tagGroups[1];
  let i = 0;
  Object.entries(HOLDS).forEach(([name, count]) => {
    for (let k=0;k<count && i<S.vehicles.length;k++,i++){
      const v = S.vehicles[i]; v.groupId = by[name].id;
      S.tags[v.id] = {};
      S.tags[v.id][shift.id] = shift.tags[rnd()>0.72?1:0].id;
      S.tags[v.id][type.id]  = type.tags[Object.keys(CLASSES).indexOf(v.cls)].id;
    }
  });
}

/* ══ helpers ════════════════════════════════════════════════════════════ */
const byId  = id => S.groups.find(g => g.id === id) || null;
const kids  = id => S.groups.filter(g => g.parentId === id);
const tops  = () => S.groups.filter(g => g.parentId === null);
function up(id){ const o=[]; let g=byId(id), n=0; while(g&&n++<20){ o.push(g); g=g.parentId?byId(g.parentId):null; } return o; }
const path    = id => up(id).reverse();
const pathStr = id => path(id).map(g=>g.name).join(' › ');
const depth   = id => up(id).length;                    /* a top-level group is 1 */
function under(id){ const o=[]; (function w(p){ kids(p).forEach(c=>{o.push(c); w(c.id);}); })(id); return o; }
const subDepth = id => 1 + Math.max(0, ...under(id).map(d => depth(d.id) - depth(id)));
function canParent(id, to){
  if (!to) return true;                                          /* top level always allowed */
  if (id === to) return false;
  if (up(to).some(a => a.id === id)) return false;               /* no cycles */
  return depth(to) + subDepth(id) <= MAX_DEPTH;                  /* the cap */
}
const inGroup = (id, deep) => {
  const set = new Set([id].concat(deep ? under(id).map(g=>g.id) : []));
  return S.vehicles.filter(v => set.has(v.groupId));
};
const unplaced = () => S.vehicles.filter(v => !v.groupId);
/* Depth-first, so the list reads like the structure without being a tree. */
function ordered(){
  const o=[]; (function w(p){ kids(p).forEach(c=>{ o.push(c); w(c.id); }); })(null); return o;
}

const num = n => Number(n).toLocaleString('en-ZA');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colour = i => TAG_COLOURS[i % TAG_COLOURS.length];

function snap(label){
  S.undo.push({ label, groups:JSON.parse(JSON.stringify(S.groups)),
    tagGroups:JSON.parse(JSON.stringify(S.tagGroups)),
    homes:S.vehicles.map(v=>v.groupId), tags:JSON.parse(JSON.stringify(S.tags)) });
  if (S.undo.length>20) S.undo.shift();
}
function undo(){
  const u = S.undo.pop(); if (!u) return null;
  S.groups=u.groups; S.tagGroups=u.tagGroups; S.tags=u.tags;
  S.vehicles.forEach((v,i)=>v.groupId=u.homes[i]);
  return u.label;
}

/* ══ chrome ═════════════════════════════════════════════════════════════ */
const el = id => document.getElementById(id);
const say = m => { el('say').textContent=''; setTimeout(()=>el('say').textContent=m,30); };
let tt;
function toast(msg, undoable){
  const t = el('toast');
  t.innerHTML = '<span>'+esc(msg)+'</span>'+(undoable?'<button type="button" id="tu">Undo</button>':'');
  t.dataset.state='on';
  if (undoable) el('tu').onclick = () => { const l=undo(); t.dataset.state='off'; if(l){ draw(); toast(l+' undone'); } };
  clearTimeout(tt); tt=setTimeout(()=>t.dataset.state='off',8000); say(msg);
}

/* ══ groups ═════════════════════════════════════════════════════════════ */
/* A flat list in structure order. Nesting is shown by the "in X" line and
   set by a dropdown on the form, exactly like Linear's team hierarchy.
   There is no tree to expand and nothing to drag. */
function pageGroups(){
  const list = ordered();
  const out = unplaced().length;
  return '<div class="o-head"><h1>Groups</h1>'+
      '<p>The parts of your business that bill, or report, or are managed separately.</p></div>'+
    '<div class="o-bar"><h2>'+num(list.length)+' group'+(list.length===1?'':'s')+'</h2>'+
      '<span style="margin-left:auto"></span>'+
      '<button class="a-btn a-btn--go" type="button" data-act="newGroup">New group</button></div>'+
    /* The scent to the next task. Without this the trail goes cold the
       moment the groups exist, and nothing says what to do with them. */
    (list.length && out ?
      '<button class="o-next" type="button" data-act="toUnplaced">'+
        '<span class="o-next__m"><strong>'+num(out)+' vehicles are not in a group yet</strong>'+
        '<span>Put them in one so billing and reporting can follow the structure.</span></span>'+
        '<span class="o-next__a">Place them →</span></button>' : '')+
    (list.length ? list.map(g => {
      const kid = kids(g.id).length, v = inGroup(g.id,true).length;
      return '<div class="m-row">'+
        '<span class="m-row__m" style="padding-left:'+((depth(g.id)-1)*16)+'px">'+
          '<span class="m-row__n">'+esc(g.name)+'</span>'+
          '<span class="m-row__s">'+
            (g.parentId ? 'in '+esc(byId(g.parentId).name) : 'Top level')+
            (kid?' · '+kid+(kid===1?' group inside':' groups inside'):'')+'</span></span>'+
        '<span class="m-row__a">'+
          '<span class="a-count" title="'+num(v)+' vehicles, including any inside this group">'+num(v)+'</span>'+
          '<button class="a-btn a-btn--sm a-btn--icon" type="button" data-act="rowMenu" data-id="'+g.id+
            '" aria-label="Actions for '+esc(g.name)+'">⋯</button>'+
        '</span></div>';
    }).join('')
      : '<div class="m-empty"><span class="m-empty__g" aria-hidden="true">▦</span>'+
        '<h3>No groups yet</h3>'+
        '<p>Create one for each part of the business that needs its own rules, its own invoice or its own '+
        'manager. Anything that only describes a vehicle is a tag, not a group.</p>'+
        '<span class="m-empty__a">'+
          '<button class="a-btn a-btn--go" type="button" data-act="newGroup">New group</button>'+
          '<button class="a-btn" type="button" data-act="example">Use the example</button>'+
        '</span></div>')+
    '';
}
function formGroup(g){
  const opts = S.groups.filter(x => !g || canParent(g.id, x.id));
  const parent = g ? (g.parentId || '') : '';
  return '<label class="m-field"><span class="m-field__l">Name</span>'+
      '<input class="a-in" id="gName" value="'+esc(g?g.name:'')+'" placeholder="Cape Town"></label>'+
    '<label class="m-field"><span class="m-field__l">Sits inside</span>'+
      '<select class="a-sel" id="gParent">'+
      '<option value=""'+(parent?'':' selected')+'>Nothing, it is top level</option>'+
      opts.map(x=>'<option value="'+x.id+'"'+(x.id===parent?' selected':'')+'>'+esc(pathStr(x.id))+'</option>').join('')+
      '</select>'+
      (g ? '<span class="m-field__h">Anything already inside this group moves with it.</span>' : '')+
    '</label>'+
    (g ? '' :
      '<div class="m-note"><i>◈</i><span>Make a group if it bills, reports or is managed separately. '+
      'If it only describes a vehicle, such as its shift or its size, make a <strong>tag</strong> instead.</span></div>');
}

/* ══ tags ═══════════════════════════════════════════════════════════════ */
/* A tag group is the question, a tag is one of the answers, and only one tag
   from a group can apply. That is Linear's label groups, unchanged. */
function pageTags(){
  return '<div class="o-head"><h1>Tags</h1>'+
      '<p>A question asked of every vehicle, and its possible answers.</p></div>'+
    '<div class="o-bar"><h2>'+S.tagGroups.length+' tag group'+(S.tagGroups.length===1?'':'s')+'</h2>'+
      '<span style="margin-left:auto"></span>'+
      '<button class="a-btn a-btn--go" type="button" data-act="newTagGroup">New tag group</button></div>'+
    (S.tagGroups.length ? S.tagGroups.map((tg, gi) => {

      return '<div class="m-tg"><div class="m-tg__h">'+
          '<span class="m-tg__n">'+esc(tg.name)+'</span>'+

              '" aria-label="Actions for '+esc(t.name)+'">⋯</button></li>';

    }).join('')
      : '<div class="m-empty"><span class="m-empty__g" aria-hidden="true">◍</span>'+
        '<h3>No tags yet</h3>'+

        'or “Vehicle type” with the kinds you run.</p>'+
        '<span class="m-empty__a">'+
          '<button class="a-btn a-btn--go" type="button" data-act="newTagGroup">New tag group</button>'+
          '<button class="a-btn" type="button" data-act="example">Use the example</button>'+
        '</span></div>')+

}

/* ══ vehicles ═══════════════════════════════════════════════════════════ */
function matching(){
  let list = S.vehicles;
  if (S.filter === 'none') list = list.filter(v => !v.groupId);
  else if (S.filter)       list = inGroup(S.filter, true);
  if (S.tagFilter){
    list = list.filter(v => S.tags[v.id] && Object.values(S.tags[v.id]).indexOf(S.tagFilter) > -1);
  }
  const q = S.q.trim().toLowerCase();
  if (q) list = list.filter(v => v.reg.toLowerCase().indexOf(q) > -1);
  return list;
}
function tagName(id){
  for (const tg of S.tagGroups){ const t = tg.tags.find(x=>x.id===id); if (t) return tg.name+': '+t.name; }
  return '';
}
function pageVehicles(){
  const list = matching(), show = list.slice(0, 100);
  const all  = list.length && list.every(v => S.rows.has(v.id));
  return '<div class="o-head"><h1>Vehicles</h1>'+
      '<p>Put them in a group. You can come back to whatever is left.</p></div>'+
    '<div class="o-filters">'+
      '<input class="a-in" type="search" id="q" value="'+esc(S.q)+'" placeholder="Search a registration"'+
        ' aria-label="Search a registration">'+
      '<select class="a-sel" id="filter" aria-label="Filter by group">'+
        '<option value="">Every group</option>'+
        '<option value="none"'+(S.filter==='none'?' selected':'')+'>Not in a group</option>'+
        ordered().map(g=>'<option value="'+g.id+'"'+(S.filter===g.id?' selected':'')+'>'+esc(pathStr(g.id))+'</option>').join('')+
      '</select>'+
      (S.tagFilter ? '<button class="a-btn a-btn--sm" type="button" data-act="clearTag">'+
        esc(tagName(S.tagFilter))+' ✕</button>' : '')+
    '</div>'+
    /* One count, not two. Krug: never make anyone reconcile two numbers. */
    '<div class="o-bar"><h2>'+num(list.length)+' vehicle'+(list.length===1?'':'s')+'</h2>'+
      (list.length>100?'<span class="o-bar__n">first 100 listed</span>':'')+
      '<span style="margin-left:auto"></span>'+
      (list.length ? '<button class="a-btn a-btn--sm" type="button" data-act="all">'+
        (all?'Clear selection':'Select all '+num(list.length))+'</button>' : '')+
    '</div>'+
    '<div class="o-scroll"><table class="o-tbl"><thead><tr>'+
      '<th style="width:26px"><span class="vh">Selected</span></th>'+
      '<th>Registration</th><th>Type</th><th>Group</th></tr></thead><tbody>'+
      (show.length ? show.map(v =>
        '<tr><td><input class="a-check" type="checkbox" data-act="row" data-id="'+v.id+'"'+
          (S.rows.has(v.id)?' checked':'')+' aria-label="Select '+esc(v.reg)+'"></td>'+
        '<td style="font-family:var(--mono)">'+esc(v.reg)+'</td><td>'+esc(v.cls)+'</td>'+
        '<td class="quiet">'+(v.groupId?esc(byId(v.groupId).name):'<span class="a-chip" data-tone="warn">None</span>')+'</td></tr>').join('')
        : '<tr><td colspan="4"><div class="m-empty" style="border:0">'+
          '<h3>'+(S.q?'Nothing matches “'+esc(S.q)+'”':'Nothing here')+'</h3>'+
          '<p>'+(S.q?'Check the registration, or clear the search.':'Try a different filter.')+'</p></div></td></tr>')+
      '</tbody></table></div>'+

/* ══ render ═════════════════════════════════════════════════════════════ */
const BODY = { groups:pageGroups, tags:pageTags, vehicles:pageVehicles };
function draw(){
  el('nav').innerHTML = PAGES.map(p =>
    '<li><button class="o-side__b" type="button" data-page="'+p.id+'" aria-current="'+(S.page===p.id)+'">'+
    esc(p.t)+'</button></li>').join('');

  el('dataNote').textContent = S.groups.length
    ? num(S.groups.length)+' groups, '+num(S.tagGroups.length)+' tag groups, '+num(placedN)+' vehicles placed.'
    : num(S.vehicles.length)+' vehicles imported. Nothing organised yet.';
  document.title = 'EngenXT · '+PAGES.find(p=>p.id===S.page).t;

function go(p){
  S.page=p; S.rows.clear(); shut(); draw(); el('main').scrollTop=0;
  if (location.hash.slice(1)!==p) history.replaceState(null,'','#'+p);
  say(PAGES.find(x=>x.id===p).t);

/* ══ events ═════════════════════════════════════════════════════════════ */
let editing = null;
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-page]'); if (nav){ go(nav.dataset.page); return; }
  const md = e.target.closest('[data-mode]');
  if (md){ const on = md.getAttribute('aria-pressed')!=='true'; md.setAttribute('aria-pressed',String(on));
    const r=document.documentElement;
    if (md.dataset.mode==='theme')  r.dataset.theme  = on?'dark':'light';
    if (md.dataset.mode==='motion') r.dataset.motion = on?'off':'system';
    return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;

  if (a==='shut') shut();
  else if (a==='rowMenu'){ const g=byId(b.dataset.id);
    modal(esc(g.name),
      '<p class="quiet" style="margin:0 0 var(--s3);font-size:var(--t-sm)">'+esc(pathStr(g.id))+'</p>'+
      '<div class="o-menu">'+
        '<button class="a-btn a-btn--bare" type="button" data-act="editGroup" data-id="'+g.id+'">Edit</button>'+
        '<button class="a-btn a-btn--bare a-btn--risk" type="button" data-act="delGroup" data-id="'+g.id+'">Delete</button>'+
      '</div>',
      '<button class="a-btn" type="button" data-act="shut">Close</button>'); }
  else if (a==='tgMenu'){ const tg=S.tagGroups[+b.dataset.i];
    modal(esc(tg.name),
      '<div class="o-menu">'+
        '<button class="a-btn a-btn--bare a-btn--risk" type="button" data-act="delTagGroup" data-i="'+b.dataset.i+'">'+
        'Delete this tag group and its '+tg.tags.length+' tags</button></div>',
      '<button class="a-btn" type="button" data-act="shut">Close</button>'); }
  else if (a==='tagMenu'){ const tg=S.tagGroups[+b.dataset.tg], t=tg.tags[+b.dataset.i];
    modal(esc(t.name),
      '<div class="o-menu"><button class="a-btn a-btn--bare a-btn--risk" type="button" '+
      'data-act="delTag" data-tg="'+b.dataset.tg+'" data-i="'+b.dataset.i+'">Delete this tag</button></div>',
      '<button class="a-btn" type="button" data-act="shut">Close</button>'); }
  else if (a==='example'){ loadExample(); draw();
    toast('Filled in '+num(S.groups.length)+' groups and '+num(S.tagGroups.length)+' tag groups', true); }
  else if (a==='wipe'){
    if (!S.groups.length && !S.tagGroups.length){ toast('Already empty'); return; }
    snap('Cleared everything');
    S.groups=[]; S.tagGroups=[]; S.tags={}; S.rows.clear(); S.filter='';
    S.vehicles.forEach(v=>v.groupId=null);
    draw(); toast('Cleared. The '+num(S.vehicles.length)+' vehicles are still here.', true); }

  else if (a==='newGroup'){ editing=null;
    modal('New group', formGroup(null),
      '<button class="a-btn" type="button" data-act="shut">Cancel</button>'+
      '<button class="a-btn a-btn--go" type="button" data-act="saveGroup">Create group</button>');
    setTimeout(()=>el('gName').focus(),40); }
  else if (a==='editGroup'){ editing=b.dataset.id;
    modal('Edit group', formGroup(byId(editing)),
      '<button class="a-btn" type="button" data-act="shut">Cancel</button>'+
      '<button class="a-btn a-btn--go" type="button" data-act="saveGroup">Save</button>');
    setTimeout(()=>el('gName').select(),40); }
  else if (a==='saveGroup'){
    const name = el('gName').value.trim(), parent = el('gParent').value || null;
    if (!name){ toast('Give the group a name'); return; }
    if (kids(parent).some(c => c.name.toLowerCase()===name.toLowerCase() && c.id!==editing)){
      toast('There is already a '+name+(parent?' in '+byId(parent).name:' at the top level')); return; }
    if (editing){ snap('Edited '+byId(editing).name);
      const g=byId(editing); g.name=name; g.parentId=parent; shut(); draw(); toast('Saved', true); }
    else { snap('Created '+name);
      S.groups.push({ id:uid('g'), name, parentId:parent }); shut(); draw(); toast(name+' created', true); } }
  else if (a==='delGroup'){ const g=byId(b.dataset.id), n=under(g.id).length, v=inGroup(g.id,true).length;
    modal('Delete '+esc(g.name)+'?',
      '<p style="margin:0;font-size:var(--t-sm)">'+
      (n?'This also deletes <strong>'+n+'</strong> group'+(n===1?'':'s')+' inside it. ':'')+
      (v?'<strong>'+num(v)+'</strong> vehicle'+(v===1?'':'s')+' will have no group.':'Nothing else is affected.')+
      '</p><div class="m-note" style="margin-top:var(--s3)"><i>↩</i><span>You can undo this straight '+
      'afterwards, from the message that appears.</span></div>',
      '<button class="a-btn" type="button" data-act="shut">Cancel</button>'+
      '<button class="a-btn a-btn--go" style="background:var(--bad);border-color:var(--bad);color:#fff" '+
      'type="button" data-act="delGroupGo" data-id="'+g.id+'">Delete</button>'); }
  else if (a==='delGroupGo'){ const g=byId(b.dataset.id);
    const doomed=new Set([g.id].concat(under(g.id).map(x=>x.id)));
    snap('Deleted '+g.name);
    S.vehicles.forEach(v=>{ if(doomed.has(v.groupId)) v.groupId=null; });
    S.groups=S.groups.filter(x=>!doomed.has(x.id));
    shut(); draw(); toast('Deleted '+g.name+(doomed.size>1?' and '+(doomed.size-1)+' inside it':''), true); }

  else if (a==='newTagGroup'){
    modal('New tag group',
      '<label class="m-field"><span class="m-field__l">Name</span>'+
        '<input class="a-in" id="tgName" placeholder="Shift"></label>'+
      '<label class="m-field"><span class="m-field__l">Tags</span>'+
        '<textarea class="a-in" id="tgTags" rows="4" placeholder="Day&#10;Night"></textarea>'+
        '<span class="m-field__h">One per line. Only one of them can apply to a vehicle at a time, '+
        'which is what makes the totals in a report add up.</span></label>',
      '<button class="a-btn" type="button" data-act="shut">Cancel</button>'+
      '<button class="a-btn a-btn--go" type="button" data-act="saveTagGroup">Create</button>');
    setTimeout(()=>el('tgName').focus(),40); }
  else if (a==='saveTagGroup'){
    const n = el('tgName').value.trim();
    const list = el('tgTags').value.split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);
    if (!n || !list.length){ toast('A tag group needs a name and at least one tag'); return; }
    snap('Created '+n);
    S.tagGroups.push({ id:uid('tg'), name:n, tags:list.map((t,i)=>({id:uid('t'), name:t, c:i})) });
    shut(); draw(); toast(n+' created', true); }
  else if (a==='delTagGroup'){ shut(); snap('Deleted a tag group');
    const tg=S.tagGroups.splice(+b.dataset.i,1)[0];
    S.vehicles.forEach(v=>{ if(S.tags[v.id]) delete S.tags[v.id][tg.id]; });
    draw(); toast('Deleted '+tg.name, true); }
  else if (a==='newTag'){
    modal('Add tag',
      '<label class="m-field"><span class="m-field__l">Name</span>'+
      '<input class="a-in" id="tName" placeholder="Weekend"></label>',
      '<button class="a-btn" type="button" data-act="shut">Cancel</button>'+
      '<button class="a-btn a-btn--go" type="button" data-act="saveTag" data-tg="'+b.dataset.tg+'">Add</button>');
    setTimeout(()=>el('tName').focus(),40); }
  else if (a==='saveTag'){ const n=el('tName').value.trim(); if(!n){ toast('Give the tag a name'); return; }
    const tg=S.tagGroups.find(x=>x.id===b.dataset.tg);
    snap('Added '+n); tg.tags.push({ id:uid('t'), name:n, c:tg.tags.length });
    shut(); draw(); toast(n+' added', true); }
  else if (a==='delTag'){ shut(); const tg=S.tagGroups[+b.dataset.tg];
    snap('Deleted a tag'); const t=tg.tags.splice(+b.dataset.i,1)[0];
    S.vehicles.forEach(v=>{ if(S.tags[v.id]&&S.tags[v.id][tg.id]===t.id) delete S.tags[v.id][tg.id]; });
    draw(); toast('Deleted '+t.name, true); }

  else if (a==='all'){ const list=matching();
    const on = list.length && list.every(v=>S.rows.has(v.id));
    if (on) S.rows.clear(); else list.forEach(v=>S.rows.add(v.id));
    draw(); if(!on) toast(num(list.length)+' selected'); }
  else if (a==='toUnplaced'){ S.filter='none'; S.q=''; S.tagFilter=null; S.rows.clear(); go('vehicles'); }
  else if (a==='byTag'){ S.tagFilter=b.dataset.tag; S.filter=''; S.q=''; S.rows.clear(); go('vehicles'); }
  else if (a==='clearTag'){ S.tagFilter=null; draw(); }
  else if (a==='row'){ b.checked?S.rows.add(b.dataset.id):S.rows.delete(b.dataset.id); draw(); }
  else if (a==='clear'){ S.rows.clear(); draw(); }
  else if (a==='move'){
    modal('Move '+num(S.rows.size)+' vehicles',
      '<label class="m-field"><span class="m-field__l">Group</span>'+
      '<select class="a-sel" id="mv">'+ordered().map(g=>'<option value="'+g.id+'">'+esc(pathStr(g.id))+'</option>').join('')+
      '</select></label>',
      '<button class="a-btn" type="button" data-act="shut">Cancel</button>'+
      '<button class="a-btn a-btn--go" type="button" data-act="moveGo">Move</button>'); }
  else if (a==='moveGo'){ const to=el('mv').value, n=S.rows.size;
    snap('Moved '+n+' vehicles');
    S.vehicles.forEach(v=>{ if(S.rows.has(v.id)) v.groupId=to; });
    S.rows.clear(); shut(); draw(); toast('Moved '+num(n)+' into '+byId(to).name, true); }
});
document.addEventListener('change', e => {
  if (e.target.id==='filter'){ S.filter=e.target.value; S.rows.clear(); draw(); }
});
document.addEventListener('input', e => {
  if (e.target.id==='q'){
    S.q = e.target.value; S.rows.clear();
    const at = e.target.selectionStart; draw();
    const f = el('q'); if (f){ f.focus(); f.setSelectionRange(at, at); }
  }
});

/* ══ boot ═══════════════════════════════════════════════════════════════ */
go(PAGES.some(p=>p.id===location.hash.slice(1)) ? location.hash.slice(1) : 'groups');
window.addEventListener('hashchange', () => {
  const h=location.hash.slice(1); if (PAGES.some(p=>p.id===h)&&h!==S.page) go(h);
});
</script>
</body>
