/* ── E2/E3 · Editing one rule, and the three lock modes ────────────────── */
const LOCK_COPY = {
  open:    ['Open',           'Any group beneath can set its own value.'],
  tighten: ['Tighten only',   'Groups beneath can make this stricter, but never looser.'],
  exact:   ['Locked exactly', 'No group beneath can change this at all. Advanced.'],
};
function editRule(gid, key){
  const r = RULE_BY_KEY[key];
  const res = resolveRule(gid, key);
  const own = S.attach[gid] && S.attach[gid][key];
  const v = own ? own.value : (res ? res.value : null);
  const lock = own ? own.lock : 'open';

  let field = '';
  if (r.type === 'rand' || r.type === 'litres')
    field = '<input class="a-input" id="rv" type="number" step="' + (r.type === 'litres' ? '0.05' : '50') + '" value="' + v + '">';
  else if (r.type === 'window')
    field = '<div style="display:flex;gap:var(--sp-2);align-items:center">' +
            '<input class="a-input" id="rv0" type="number" min="0" max="23" value="' + v[0] + '" aria-label="From hour">' +
            '<span>to</span>' +
            '<input class="a-input" id="rv1" type="number" min="1" max="24" value="' + v[1] + '" aria-label="To hour"></div>';
  else if (r.type === 'bool')
    field = '<label style="display:flex;gap:var(--sp-2);align-items:center">' +
            '<input class="a-check" id="rv" type="checkbox"' + (v ? ' checked' : '') + '> Required</label>';
  else if (r.type === 'set')
    field = ['Diesel','Petrol'].map(p =>
      '<label style="display:inline-flex;gap:var(--sp-1h);align-items:center;margin-right:var(--sp-4)">' +
      '<input class="a-check" type="checkbox" data-set="' + p + '"' + (v.includes(p) ? ' checked' : '') + '> ' + p + '</label>').join('');

  const parentRes = byId(gid).parentId ? resolveRule(byId(gid).parentId, key) : null;
  openDialog(esc(r.label),
    '<p style="margin:0 0 var(--sp-3);font-size:var(--text-caption);color:var(--color-text-secondary)">' +
      esc(CLS_LABEL[r.cls]) + '. ' +
      (parentRes ? 'Inherited value is <strong>' + esc(fmtValue(key, parentRes.value)) + '</strong> from ' + esc(parentRes.srcName) + '.'
                 : 'Nothing above sets this.') + '</p>' +
    '<div style="margin-bottom:var(--sp-4)">' + field + '</div>' +
    '<fieldset style="border:var(--hairline) solid var(--color-border);border-radius:var(--radius-sm);padding:var(--sp-3)">' +
      '<legend style="font-size:var(--text-caption);font-weight:700;padding:0 var(--sp-1)">What groups beneath may do</legend>' +
      Object.entries(LOCK_COPY).map(([m, t]) =>
        '<label style="display:flex;gap:var(--sp-2);align-items:flex-start;padding:var(--sp-1) 0">' +
        '<input type="radio" name="lockmode" value="' + m + '"' + (lock === m ? ' checked' : '') + '>' +
        '<span><strong style="font-size:var(--text-small)">' + t[0] + '</strong>' +
        '<span style="display:block;font-size:var(--text-micro);color:var(--color-text-secondary)">' + t[1] + '</span></span></label>').join('') +
    '</fieldset>' +
    (res && res.blocked && res.blocked.length ?
      '<div class="m-note" data-tone="warning" style="margin-top:var(--sp-3)"><span class="m-note__ico">🔒</span><span>' +
      res.blocked.map(b => esc(b.group.name) + ' tried to set ' + esc(fmtValue(key, b.value)) + ', ' + esc(b.why)).join('<br>') +
      '</span></div>' : ''),
    '<button class="a-btn a-btn--quiet" type="button" data-act="close">Cancel</button>' +
    '<button class="a-btn a-btn--primary" type="button" data-act="save-rule" data-g="' + gid + '" data-rule="' + key + '">Save</button>');
}
function saveRule(gid, key){
  const r = RULE_BY_KEY[key];
  let value;
  if (r.type === 'rand' || r.type === 'litres') value = parseFloat(el('rv').value);
  else if (r.type === 'window') value = [parseInt(el('rv0').value, 10), parseInt(el('rv1').value, 10)];
  else if (r.type === 'bool') value = el('rv').checked;
  else if (r.type === 'set') value = [...document.querySelectorAll('[data-set]')].filter(c => c.checked).map(c => c.dataset.set);
  const lock = document.querySelector('[name="lockmode"]:checked').value;

  const parentId = byId(gid).parentId;
  const inherited = parentId ? resolveRule(parentId, key) : null;
  if (inherited && inherited.lock && inherited.lock.mode === 'tighten' && !isTighter(key, value, inherited.value)){
    toast('That would loosen a rule ' + inherited.lock.name + ' locked. Allowed up to ' + fmtValue(key, inherited.value) + '.');
    return;
  }
  snapshot('Changed ' + r.label);
  S.attach[gid] = S.attach[gid] || {};
  S.attach[gid][key] = { value, lock };
  closeDialog(); renderAll();
  toast(r.label + ' set to ' + fmtValue(key, value) + ' on ' + byId(gid).name, true);
}

/* ── F · The shared asset ──────────────────────────────────────────────── */
function sharedPair(){
  const shared = S.account.vehicles.find(v => v.sharedWith.length && byId(v.sharedWith[0]));
  if (!shared) return null;
  const d = S.account.drivers.find(x => x.homeId === shared.sharedWith[0]) ||
            S.account.drivers.find(x => x.homeId && x.homeId !== shared.homeId) || S.account.drivers[0];
  return { v: shared, d };
}
function seedShared(){
  ensureStructure();
  if (sharedPair()) return;
  const tops = childrenOf(rootGroup().id).filter(g => !g.system);
  if (tops.length < 2) return;
  const [a, b] = tops;
  const aHolders = [a].concat(descendants(a.id)).filter(g => vehiclesIn(g.id, false).length);
  const bHolders = [b].concat(descendants(b.id)).filter(g => driversIn(g.id, false).length);
  if (!aHolders.length || !bHolders.length) return;
  const v = vehiclesIn(aHolders[0].id, false)[0];
  if (!v) return;
  v.sharedWith = [bHolders[0].id];
  if (!S.loans.some(l => l.vehicleId === v.id))
    S.loans.push({ vehicleId:v.id, groupId:bHolders[0].id, from:'3 March', to:'17 March', active:false });
}

/* ── G · Explain a decline ─────────────────────────────────────────────── */
/* Transaction first, not rule first. "Inherited from X" on a settings screen
   answers nothing at 19:04 with a driver standing at a pump. */
function renderDecline(){
  seedShared();
  const pair = sharedPair() || { v:S.account.vehicles[0], d:S.account.drivers[0] };
  const v = pair.v, d = pair.d;
  const fill = resolveForFill(v, d, {});
  const tx = { hour:19, minute:4, litres: v.tank ? Math.round(v.tank * 0.95) : 380, supplier:'Engen Rivonia' };
  tx.value = Math.round(tx.litres * 24.6);

  const checks = RULES.map(r => {
    const x = fill.rules[r.key], val = x.applied;
    let pass = true, note = 'not set';
    if (val != null) switch (r.key){
      case 'window':    pass = tx.hour >= val[0] && tx.hour < val[1];
                        note = 'fill at ' + pad2(tx.hour) + ':' + pad2(tx.minute); break;
      case 'products':  pass = val.includes(v.fuelType); note = v.fuelType; break;
      case 'maxValue':  pass = tx.value <= val; note = zar(tx.value); break;
      case 'dailyCap':  pass = tx.value <= val; note = zar(tx.value) + ' today'; break;
      case 'maxLitres': pass = !v.tank || tx.litres <= v.tank * val; note = tx.litres + ' of ' + (v.tank || '?') + ' L'; break;
      case 'approval':  note = tx.value > val ? 'approval requested' : 'below the threshold'; break;
      default:          note = 'ok';
    }
    return { r, pass, note, val, x };
  });
  const failed = checks.filter(c => !c.pass);

  el('scDecline').innerHTML =
    '<div class="t-screen__lede">' +
      '<h1 class="t-screen__h1" id="declineH">Why this was ' + (failed.length ? 'declined' : 'approved') + '</h1>' +
      '<p class="t-screen__sub">Every rule that was evaluated, in order, with the group that set it and something you can do about it.</p>' +
    '</div>' +
    '<div class="m-card" style="max-width:820px">' +
      '<div class="m-card__head"><div>' +
        '<h2 class="m-card__title">' + (failed.length ? 'Declined' : 'Approved') + ' · ' + esc(v.reg) + '</h2>' +
        '<p class="m-card__sub">' + esc(tx.supplier) + ' · ' + pad2(tx.hour) + ':' + pad2(tx.minute) + ' · ' +
          tx.litres + ' L · ' + zar(tx.value) + ' · ' + esc(d.name) + '</p></div>' +
        '<span class="a-chip" data-tone="' + (failed.length ? 'error' : 'success') + '" style="margin-left:auto">' +
          (failed.length ? failed.length + ' failed' : 'All passed') + '</span></div>' +
      '<div class="m-card__body">' +
        checks.map(c => {
          const src = c.x.authoritative || c.x.fromVehicle || c.x.fromPaying;
          return '<div class="m-rule" data-state="' + (c.pass ? 'idle' : 'blocked') + '">' +
            '<span class="m-rule__label">' +
              '<span class="a-dot" data-tone="' + (c.pass ? 'success' : 'error') + '" style="display:inline-block;margin-right:6px"></span>' +
              esc(c.r.label) + '<span class="m-rule__class">' + esc(CLS_LABEL[c.r.cls]) + '</span></span>' +
            '<span class="m-rule__value">' + esc(fmtValue(c.r.key, c.val)) + '</span>' +
            '<span style="font-size:var(--text-micro);color:var(--color-text-secondary)">' + esc(c.note) + '</span>' +
            '<span class="m-rule__act">' + (src ?
              '<span class="a-chip" data-source="' + (src.lock ? 'locked' : 'inherited') + '">' +
              (src.lock ? '🔒 ' : '') + esc(src.srcName) + '</span>' : '') + '</span></div>';
        }).join('') +
      '</div>' +
      (failed.length ? '<div class="m-card__foot">' +
        '<button class="a-btn a-btn--secondary a-btn--sm" type="button" data-act="go" data-to="E1">Change this rule for the group</button>' +
        '<button class="a-btn a-btn--quiet a-btn--sm" type="button" data-act="ask-owner">Ask the rule owner</button></div>' : '') +
    '</div>' +
    '<div class="m-note" style="max-width:820px;margin-top:var(--sp-3)"><span class="m-note__ico">◷</span><span>' +
      'The values above are the ones stored on the transaction at the time, not worked out again now. ' +
      'A restructure next month will not change what this record says happened.</span></div>';
}

  el('scDone').innerHTML =

      '<h1 class="t-screen__h1" id="doneH">Ready to go live</h1>' +
      '<p class="t-screen__sub">One thing counts as finished. Everything else is optional and can wait.</p></div>' +
    '<div class="m-card" style="max-width:640px"><div class="m-card__body">' +
      '<p style="margin:0 0 var(--sp-2);font-weight:700">Every vehicle has a home group</p>' +
      '<div class="a-bar" style="margin-bottom:var(--sp-2)"><div class="a-bar__fill" data-tone="' +
        (unplaced ? 'warning' : 'success') + '" style="width:' + pct + '%"></div></div>' +
      '<p class="u-num" style="margin:0;font-size:var(--text-caption);color:var(--color-text-secondary)">' +
        num(placed) + ' of ' + num(total) + ' placed' +
        (unplaced ? ' · <strong>' + num(unplaced) + ' waiting in Unassigned</strong>' : '') + '</p>' +
      (unplaced ?
        '<div class="m-note" data-tone="info" style="margin-top:var(--sp-3)"><span class="m-note__ico">◈</span><span>' +
        'Go live now and place these later. If the answer is a finance question, park it. ' +
        'Structure never holds up activation.</span></div>' : '') +
    '</div><div class="m-card__foot">' +
      '<button class="a-btn a-btn--primary" type="button" data-act="activate">Finish setup</button>' +
      (unplaced ? '<button class="a-btn a-btn--quiet" type="button" data-act="go" data-to="D1">Place the rest first</button>' : '') +
    '</div></div>';
}

let noteText = '';
function note(t){ noteText = t; renderCaption(); }
function renderCaption(){
  const st = STATES.find(s => s.id === S.screen);
  el('caption').innerHTML =
    '<strong style="color:var(--color-text-secondary)">' + (st ? esc(st.id + ' · ' + st.t) : '') + '</strong>' +
    '<span>' + esc(noteText) + '</span>';
}

function renderNav(){
  el('accountSwitch').innerHTML = Object.entries(SPECS).map(([k, v]) =>
    '<button class="o-state-nav__chip" type="button" data-acct="' + k + '" aria-pressed="' +
    (S.accountId === k) + '">' + esc(v.label) + '</button>').join('');
  let html = '', lastG = '';
  STATES.forEach(s => {
    if (s.g !== lastG){ html += '<h2 class="o-state-nav__h">' + esc(s.g) + '</h2>'; lastG = s.g; }
    html += '<button class="o-state-nav__b" type="button" data-state-id="' + s.id + '" aria-current="' +
      (S.screen === s.id) + '"><span class="o-state-nav__id">' + s.id + '</span><span>' + esc(s.t) + '</span></button>';
  });
  el('stateList').innerHTML = html;
}

function go(id){
  const st = STATES.find(s => s.id === id); if (!st) return;
  S.screen = id;
  el('pop').hidden = true; closeDialog();
  st.run();
  renderNav(); renderCaption();
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  announce(st.id + ', ' + st.t);
}
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (id && id !== S.screen) go(id);
});

function setAccount(id){
  if (S.accountId === id) return;
  S.accountId = id;
  S.account = buildAccount(id);
  S.groups = []; S.attach = {}; S.tags = {}; S.tagGroups = []; S.loans = [];
  S.expanded = new Set(); S.selectedRows = new Set(); S.selectedGroup = null;
  S.proposal = null; S.undo = []; S.layers = []; treeFilter = ''; treeFocusId = null; S.seq = 0;
  el('portalAccount').textContent = SPECS[id].company + ' · ' +
    num(S.account.vehicles.length) + ' vehicles, ' + num(S.account.drivers.length) + ' drivers';
}

function renderAll(){
  if (!S.groups.length) return;
  if (!byId(S.selectedGroup)) S.selectedGroup = rootGroup() && rootGroup().id;
  renderTree(); renderRecords(); renderInspector();
}

/* ── Events. One delegated listener. ───────────────────────────────────── */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-state-id]');
  if (nav){ go(nav.dataset.stateId); return; }
  const acct = e.target.closest('[data-acct]');
  if (acct){ setAccount(acct.dataset.acct); go(S.screen || 'A2'); return; }
  const mode = e.target.closest('[data-mode]');
  if (mode){ toggleMode(mode); return; }

  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  const gid = S.selectedGroup;

  /* ── Creation: layers, groups, labels ───────────────────────────────── */
  if (a === 'layer-add'){ snapshot('Added a layer');
    S.layers.push(LAYER_SUGGEST[Math.min(S.layers.length, LAYER_SUGGEST.length - 1)]);
    renderLayers(); announce('Layer added'); return; }
  if (a === 'layer-quick'){ snapshot('Added a layer');
    S.layers.push(b.dataset.n); renderLayers(); announce(b.dataset.n + ' added'); return; }
  if (a === 'layer-del'){
    const i = +b.dataset.i;
    if (i + 1 <= maxUsedDepth()){ toast('Groups already sit at this layer. Move or delete them first.'); return; }
    snapshot('Removed a layer'); S.layers.splice(i, 1); renderLayers(); toast('Layer removed', true); return; }
  if (a === 'new-group'){ newGroupDialog(); return; }
  if (a === 'new-group-save'){
    const name = el('ngName').value.trim();
    if (!name){ toast('Give the group a name so it can be matched to your vehicles'); return; }
    const parent = byId(el('ngParent').value);
    if (childrenOf(parent.id).some(c => normKey(c.name) === normKey(name))){
      toast('There is already a ' + name + ' inside ' + parent.name); return; }
    snapshot('Added ' + name);
    const g = { id:uid('g'), name, parentId:parent.id };
    S.groups.push(g); S.expanded.add(parent.id); S.selectedGroup = g.id;
    closeDialog(); renderGroups(); toast(name + ' added', true); return; }
  if (a === 'paste-groups'){ pasteGroupsDialog(); return; }
  if (a === 'paste-save'){
    const parent = byId(el('pasteParent').value);
    const lines = el('pasteBox').value.split('\n').map(s => s.trim()).filter(Boolean);
    const existing = new Set(childrenOf(parent.id).map(c => normKey(c.name)));
    const fresh = [];
    lines.forEach(l => { const k = normKey(l); if (!existing.has(k)){ existing.add(k); fresh.push(l); } });
    if (!fresh.length){ toast('Nothing new in that list'); return; }
    snapshot('Created ' + fresh.length + ' groups');
    fresh.forEach(n => S.groups.push({ id:uid('g'), name:titleise(n), parentId:parent.id }));
    S.expanded.add(parent.id);
    closeDialog(); renderGroups();
    toast('Created ' + fresh.length + ' groups' + (lines.length > fresh.length ?
      ', skipped ' + (lines.length - fresh.length) + ' already there' : ''), true); return; }
  if (a === 'new-tag'){ newTagDialog(); return; }
  if (a === 'new-tag-save'){
    const label = el('tgName').value.trim();
    const values = el('tgVals').value.split('\n').map(s => titleise(s)).filter(Boolean);
    if (!label || !values.length){ toast('A label group needs a question and at least one answer'); return; }
    snapshot('Added a label group');
    S.tagGroups.push({ key: label.toLowerCase().replace(/\s+/g,'-'), label, values, exclusive: el('tgExcl').checked });
    closeDialog(); renderTags(); toast(label + ' added', true); return; }
  if (a === 'tag-del'){ snapshot('Removed a label group');
    S.tagGroups.splice(+b.dataset.i, 1); renderTags(); toast('Label group removed', true); return; }

  if (a === 'close') closeDialog();
  else if (a === 'close-pop') el('pop').hidden = true;
  else if (a === 'go') go(b.dataset.to);
  else if (a === 'promote'){ go('B1'); }
  else if (a === 'simulate') showSimulation(gid || rootGroup().id);
  else if (a === 'edit-rule') editRule(gid || rootGroup().id, b.dataset.rule);
  else if (a === 'reset-rule'){
    snapshot('Reset rule'); delete S.attach[gid][b.dataset.rule];
    renderAll(); if (el('scSimple').dataset.state === 'on') renderSimple();
    toast('Reset to the inherited value', true); }
  else if (a === 'save-rule') saveRule(b.dataset.g, b.dataset.rule);
  else if (a === 'fix-missing') toast('Opens the vehicles missing a tank capacity so they can be filled in');
  else if (a === 'twist'){ const id = b.dataset.id;
    S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); renderTree(); }
  else if (a === 'select') selectGroup(b.dataset.id);
  else if (a === 'node-menu') nodeMenu(b.dataset.id);
  else if (a === 'tab'){ inspectTab = b.dataset.t; renderInspector(); }
  else if (a === 'sel-all'){ const vs = vehiclesIn(gid, true).slice(0, PAGE);
    b.checked ? vs.forEach(v => S.selectedRows.add(v.id)) : S.selectedRows.clear(); renderRecords(); }
  else if (a === 'sel-row'){ b.checked ? S.selectedRows.add(b.dataset.id) : S.selectedRows.delete(b.dataset.id); renderRecords(); }
  else if (a === 'sel-clear'){ S.selectedRows.clear(); renderRecords(); }
  else if (a === 'assign') assignPicker();
  else if (a === 'label') toast('Adds a key and value label to ' + S.selectedRows.size + ' vehicles. Labels never change a rule.');
  else if (a === 'share') toast('Lets another group’s drivers fuel these vehicles. It does not move them and does not change whose rules apply.');
  else if (a === 'assign-to'){ snapshot('Assigned vehicles');
    const n = S.selectedRows.size;
    S.account.vehicles.forEach(v => { if (S.selectedRows.has(v.id)) v.homeId = b.dataset.to; });
    S.selectedRows.clear(); closeDialog(); renderAll();
    toast('Moved ' + num(n) + ' vehicles to ' + byId(b.dataset.to).name, true); }
  else if (a === 'move-pick'){ closeDialog(); tryMove(b.dataset.id, b.dataset.to); }
  else if (a === 'move-go') doMove(b.dataset.id, b.dataset.to, false);
  else if (a === 'move-neutral') doMove(b.dataset.id, b.dataset.to, true);
  else if (a === 'why-operating') showPrecedence();
  else if (a === 'unshare'){ const p = sharedPair(); if (p){ snapshot('Stopped sharing');
    p.v.sharedWith = []; renderShared(); toast('No longer shared', true); } }
  else if (a === 'add-share') toast('Pick another group whose drivers may fuel this vehicle');
  else if (a === 'toggle-loan'){ const l = S.loans[0]; if (l){ snapshot('Loan');
    l.active = !l.active; renderShared(); toast(l.active ? 'On loan. The borrower’s rules apply from now.' : 'Loan ended', true); } }
  else if (a === 'activate') toast('Setup finished. You can carry on organising whenever you like.');
  else if (a === 'ask-owner') toast('Sends the question to whoever set the rule, not to support');
  else if (a === 'tree-help') openDialog('Keyboard',
    '<dl class="m-kv"><dt>Arrows</dt><dd>Move, open and close</dd>' +
    '<dt>Type a letter</dt><dd>Jump to a name</dd><dt>Enter</dt><dd>Select</dd>' +
    '<dt>Cmd X then Cmd V</dt><dd>Move a group without dragging</dd>' +
    '<dt>Cmd Z</dt><dd>Undo</dd><dt>Tab</dt><dd>Leaves the tree. Always.</dd></dl>',
    '<button class="a-btn a-btn--primary" type="button" data-act="close">Close</button>');
});

  if (e.target.dataset.act === 'rename-row'){ S.proposal.rows[+e.target.dataset.i].name = e.target.value; }
  if (e.target.id === 'treeSearch'){ treeFilter = e.target.value.trim(); renderTree(); }
  if (e.target.dataset.act === 'layer-name'){ S.layers[+e.target.dataset.i] = e.target.value; }

});

function nodeMenu(id){

  openDialog(esc(g.name),
    '<div class="m-crumb" style="margin-bottom:var(--sp-3)">' + esc(pathString(id)) + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:var(--sp-1)">' +
      '<button class="a-btn a-btn--quiet" style="justify-content:flex-start" type="button" data-act="menu-move" data-id="' + id + '">Move to…</button>' +
      '<button class="a-btn a-btn--quiet" style="justify-content:flex-start" type="button" data-act="menu-add" data-id="' + id + '">Add a group inside</button>' +
      '<button class="a-btn a-btn--quiet" style="justify-content:flex-start" type="button" data-act="menu-del" data-id="' + id + '">Delete</button>' +

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'menu-move'){ closeDialog(); movePicker(id); }
  if (b.dataset.act === 'menu-add'){ snapshot('Added a group');
    const g = { id:uid('g'), name:'New group', kind:'Team', parentId:id };
    S.groups.push(g); S.expanded.add(id); closeDialog(); selectGroup(g.id); toast('Group added', true); }
  if (b.dataset.act === 'menu-del'){
    const g = byId(id), kids = descendants(id), vs = vehiclesIn(id, true);
    if (!g.parentId){ toast('The top group cannot be deleted'); return; }
    closeDialog();
    openDialog('Delete ' + esc(g.name) + '?',
      '<p style="margin:0">This also deletes <strong>' + kids.length + ' groups</strong> beneath it. ' +
      num(vs.length) + ' vehicles move to Unassigned.</p>',
      '<button class="a-btn a-btn--quiet" type="button" data-act="close">Cancel</button>' +
      '<button class="a-btn a-btn--danger" type="button" data-act="del-go" data-id="' + id + '">Delete ' +
        esc(g.name) + ' and ' + kids.length + ' beneath</button>');
  }
  if (b.dataset.act === 'del-go'){
    const g = byId(id), doomed = new Set([id, ...descendants(id).map(x => x.id)]);
    snapshot('Deleted ' + g.name);
    const u = systemUnassigned();
    S.account.vehicles.forEach(v => { if (doomed.has(v.homeId)) v.homeId = u.id; });
    S.account.drivers.forEach(d => { if (doomed.has(d.homeId)) d.homeId = u.id; });
    S.groups = S.groups.filter(x => !doomed.has(x.id));
    S.selectedGroup = rootGroup().id;
    closeDialog(); renderAll();
    toast('Deleted ' + g.name + ' and ' + (doomed.size - 1) + ' groups beneath it', true);
  }
});

function assignPicker(){

  openDialog('Assign ' + num(n) + ' vehicles',
    '<div style="max-height:300px;overflow:auto">' +
    S.groups.map(t => '<button class="a-btn a-btn--quiet" style="width:100%;justify-content:flex-start;min-height:34px" ' +
      'type="button" data-act="assign-to" data-to="' + t.id + '">' +
      '<span class="m-crumb">' + esc(pathString(t.id)) + '</span></button>').join('') + '</div>',
    '<button class="a-btn a-btn--quiet" type="button" data-act="close">Cancel</button>');
}

/* Drag is an accelerator only. Every move it can do, the menu can do too. */
document.addEventListener('dragstart', e => {
  const it = e.target.closest('[role="treeitem"]'); if (!it) return;
  e.dataTransfer.setData('text/plain', it.dataset.id);
});
document.addEventListener('dragover', e => {
  const row = e.target.closest('.o-tree__row'); if (!row) return;
  e.preventDefault(); row.dataset.drop = 'into';
});
document.addEventListener('dragleave', e => {
  const row = e.target.closest('.o-tree__row'); if (row) delete row.dataset.drop;
});
document.addEventListener('drop', e => {
  const row = e.target.closest('.o-tree__row'); if (!row) return;
  e.preventDefault(); delete row.dataset.drop;
  const from = e.dataTransfer.getData('text/plain');
  const to = row.closest('[role="treeitem"]').dataset.id;
  if (from && to) tryMove(from, to);
});

/* ── Modes ─────────────────────────────────────────────────────────────── */
function toggleMode(btn){
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', String(on));
  const r = document.documentElement;
  if (btn.dataset.mode === 'theme')   r.dataset.theme = on ? 'dark' : 'light';
  if (btn.dataset.mode === 'motion')  r.dataset.motion = on ? 'off' : 'system';
  if (btn.dataset.mode === 'density') r.dataset.density = on ? 'comfortable' : 'default';
  if (btn.dataset.mode === 'narrow'){
    el('stage').style.maxWidth = on ? '320px' : '';
    el('stage').style.marginRight = on ? 'auto' : '';
  }
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
setAccount('group');
renderNav();
/* Every state is deep-linkable, so a state can be shared or screenshotted
   without clicking through to it. */
go(STATES.some(s => s.id === location.hash.slice(1)) ? location.hash.slice(1) : 'A1');
</script>
